{
 act:"Act 6 · Software factories", n:"24", title:"An old word for a new machine", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>How factories came to be</div>
 <div class="body">
  <h2 style="flex:none">The word is 58 years old. The machine is new.</h2>
  <div class="cols" style="grid-template-columns:repeat(5,1fr);gap:12px;flex:none">
   <div class="card" style="padding:14px 16px"><span class="stat" style="font-size:30px">1968</span><span class="v" style="font-size:13.5px">Bob Bemer describes a programming environment with "measures and controls for productivity and quality"</span></div>
   <div class="card" style="padding:14px 16px"><span class="stat" style="font-size:30px">1969</span><span class="v" style="font-size:13.5px">Hitachi opens the first facility called a software factory. Toshiba, NEC and Fujitsu follow</span></div>
   <div class="card" style="padding:14px 16px"><span class="stat" style="font-size:30px">2004</span><span class="v" style="font-size:13.5px">Microsoft's Software Factories: models and product lines for one kind of application</span></div>
   <div class="card" style="padding:14px 16px"><span class="stat" style="font-size:30px">2017</span><span class="v" style="font-size:13.5px">The US Air Force's Kessel Run: factory as a DevSecOps pipeline</span></div>
   <div class="card darkc" style="padding:14px 16px"><span class="stat" style="font-size:30px;color:var(--amber)">2025–26</span><span class="v" style="font-size:13.5px">Agents do the work: Spotify, Stripe, StrongDM, Vercel, Uber, and Factory as a product</span></div>
  </div>
  <div class="card plain" style="flex:none"><span class="k">What it means now</span><span class="v">The same agents you run, started by the company's own events instead of a developer, running on shared machines, visible to anyone, with people at the gates they chose.</span></div>
  <div class="foot">Not NVIDIA's "AI factory": that is a data centre for training and running models. Different thing.</div>
 </div>`,
 notes:"The word is old, and the first definition is close to ours. Bob Bemer at GE, in 1968, described a software factory as a programming environment controlled by a computer, with measures and controls for productivity and quality (quoted in Cusumano's 1991 work). Hitachi opened Software Works in 1969, the first real facility called a factory; Toshiba, NEC and Fujitsu followed, and Cusumano's 1991 book 'Japan's Software Factories' documents them.\n\nMicrosoft's 2004 'Software Factories' (Greenfield and Short) meant something else: models, patterns and product lines to build one kind of application fast. From 2017, US defence software factories such as Kessel Run and Platform One used the word for DevSecOps pipelines; the GAO counted 29 in 2023.\n\nThe AI era: Factory was founded in 2023. Spotify's Honk (Claude Code is their top-performing agent, November 2025), Stripe's Minions (over a thousand merged pull requests a week, February 2026, self-reported), StrongDM's factory where humans neither write nor review code, Dan Shapiro's five levels ending in the 'dark factory' (January 2026), then Factory 2.0 in June, Vercel on 12 August and Uber on 27 August.\n\nSo, is it 'the next step after parallel agents'? As a ladder, yes: every writer puts it after managing agents. As history, the AI factories grew out of background agents run by platform teams, not out of one developer's local graph. Say both.\n\nThe footer avoids a real confusion: NVIDIA uses 'AI factory' for GPU data centres."
},
{
 act:"Act 6 · Software factories", n:"25", title:"What starts it", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Triggered by the company, not by a developer</div>
 <div class="body">
  <h2 style="flex:none">Any flow in the company can start a run.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th>When this happens</th><th>How it reaches an agent today</th></tr>
   <tr><td class="ok">A Jira ticket is assigned or labelled</td><td>Assign it to Claude inside Jira (beta, Jira Cloud), or a Jira automation calls a routine's API</td></tr>
   <tr><td class="ok">Someone asks in a conversation</td><td>In Slack, tag @Claude. In Teams, a Power Automate flow calls the routine's API</td></tr>
   <tr><td class="ok">An error hits production</td><td>Sentry's Seer finds the cause and hands the fix to Claude, and stops where you tell it to</td></tr>
   <tr><td class="ok">A scheduled review of the last hours</td><td>A routine reads Grafana and Prometheus over MCP, finds a regression or waste, and opens a ticket or a pull request</td></tr>
   <tr><td class="ok">A pull request, a failed build, a release</td><td>A GitHub Action running Claude Code, or a routine on GitHub events</td></tr>
  </table>
  <span class="k" style="flex:none;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-soft);margin-bottom:-8px">And where the runs happen: three places</span>
  <div class="cols c3" style="flex:none;gap:14px">
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">1 · In Anthropic's cloud</span><span class="v" style="font-size:13.5px">Claude Code routines. Nothing to host: they start on a schedule, from an API call or on a GitHub event.</span><span class="xs" style="margin-top:4px">You run: nothing</span></div>
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">2 · In your GitHub Actions</span><span class="v" style="font-size:13.5px">Claude Code as a step in a workflow, on GitHub's runners or your own, with an org API key.</span><span class="xs" style="margin-top:4px">You run: the workflow</span></div>
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">3 · On your own cluster</span><span class="v" style="font-size:13.5px">Your Kubernetes, with Anthropic's self-hosted environments (beta) or your own sandboxes, like eCrop's.</span><span class="xs" style="margin-top:4px">You run: everything</span></div>
  </div>
 </div>`,
 notes:"This is the shift: the developer's keyboard is no longer the only way in. Walk each row as a real Carrot flow.\n\nJira: Atlassian's July 2026 release lets teams assign work items to Claude Code, Cursor or Copilot; the Claude Agent for Jira is a beta on Jira Cloud, running on Anthropic's Managed Agents. The other route is a Jira automation rule with 'Send web request' posting to a routine's /fire endpoint. The body arrives marked as untrusted; pass the ticket key, not the ticket text, and let the agent read the ticket.\n\nConversations: Claude Tag in Slack is a beta for Team and Enterprise. Carrot is on Teams, which has no equivalent trigger; a Power Automate flow with an HTTP step can call the routine's API (the HTTP step needs a premium Power Automate licence: check).\n\nProduction errors: Sentry's Seer Autofix can hand the code step to Claude, and you choose where it stops: after the root cause, the proposed fix, or a draft pull request. Only if they adopt Sentry.\n\nThe scheduled review is the interesting one: every few hours a routine queries Grafana and Prometheus through grafana/mcp-grafana with writes disabled, compares the window to the last one, and when latency or cost regressed, opens a ticket with the evidence or a pull request with the fix. Anthropic's own on-call agent works this way (Grafana, logs, PagerDuty, GitHub, Kubernetes, August 2026, self-reported). An in-cluster Prometheus needs a self-hosted environment or a runner inside the network.\n\nWhere it runs: routines have a minimum interval of one hour and a daily run cap. Self-hosted environments are a public beta on Team and Enterprise, with Kubernetes recipes; inference still goes to Anthropic."
},
{
 act:"Act 6 · Software factories", n:"26", title:"Vercel's software factory", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>The reference example · Vercel's AI SDK</div>
 <div class="body">
  <h2 style="flex:none">1,000 open issues and 800 open pull requests.<br>No maintainer closes that by working harder.</h2>
  <div class="loopdiag" style="flex:none">
   <span class="loopstep" style="font-size:14px">Issue or PR</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Classify</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Spec</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Implement, test end to end</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Risk review</span><span class="loopar">→</span>
   <span class="loopstep" style="background:var(--primary);color:#fff;font-size:14px">A maintainer merges</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Backport</span>
  </div>
  <div class="cols c3" style="flex:none">
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:44px">25–35%</span><span class="v">of weekly merged pull requests authored by the factory</span></div>
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:44px">75%+</span><span class="v">of the issues closed in July were closed by the factory</span></div>
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:44px">1,022 → 844</span><span class="v">open issues in four weeks</span></div>
  </div>
  <div class="foot">Each step is its own single-task agent in an isolated sandbox, started by a GitHub webhook. A maintainer reads the chain of evidence and merges every change. Vercel, 12 August 2026 · self-reported.</div>
 </div>`,
 notes:"This is the reference example, and it maps one to one onto what they built this week.\n\nThe problem: the AI SDK has over 20 million npm downloads a week and more than 100 new issues a month. By late June there were over 1,000 open issues and almost 800 pull requests. Working harder does not close that.\n\nThe pipeline: GitHub webhooks feed a queue; each run happens in an isolated sandbox; separate agents classify (labels plus a comment with the reasoning), analyse (probe the code, write a spec, check compatibility), implement with live end-to-end evidence, review with a risk score (side effects, performance, backwards compatibility), and a maintainer reads the whole chain of evidence and merges. Backports are automated too, and separate agents reproduce bugs and update docs.\n\nThe results after four weeks, all self-reported: 25 to 35% of weekly merged pull requests; more than half of weekly merges to the v6 line; in July, over 75% of closed issues closed by the factory; open issues from 1,022 to 844; open bugs down about 25%. No cost figures.\n\nTheir lessons: one agent per task; security from day one (every issue, comment and link is untrusted); build it locally first, then move it to the cloud. Every run ends as success, flawed, blocked or manual, and each outcome tells you what to improve: 'improving the factory becomes the standard engineering job'.\n\nSource: vercel.com/blog/building-a-software-factory-for-ai-sdk (Lars Grammel and Eric Dodds, 12 August 2026)."
},
{
 act:"Act 6 · Software factories", n:"27", title:"The factory we're building at eCrop", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>eCrop · the same shape, on open parts</div>
 <div class="body">
  <h2 style="flex:none">One ticket in, one reviewed merge request out,<br>each run in its own sandbox.</h2>
  <div class="loopdiag" style="flex:none">
   <span class="loopstep" style="font-size:14px">@factory, or a failed pipeline</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">A run with a budget</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Its own sandbox</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Plan, edit, sub-runs</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Tests and review</span><span class="loopar">→</span>
   <span class="loopstep" style="background:var(--primary);color:#fff;font-size:14px">Policy gate</span>
  </div>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">Any model, any vendor</span><span class="v">Every layer is open source or a standard interface. Models are reached through one gateway, with a budget per run. Any piece can be swapped.</span></div>
   <div class="card"><span class="k">No keys in the sandbox</span><span class="v">Each run gets short-lived tokens for one repository and a capped model key. Both are revoked when the run ends.</span></div>
   <div class="card darkc"><span class="k">The factory is tested too</span><span class="v">Merged changes are replayed against hidden tests. A new factory setup ships only if it doesn't do worse.</span></div>
  </div>
  <div class="foot">The policy gate: low-risk changes merge on their own, the rest waits for a person to approve. Every run leaves its cost, its state and a full trace.</div>
 </div>`,
 notes:"Keep this at the same level as Vercel's slide: the shape, not the parts list.\n\nHow one ticket moves: a developer mentions @factory on a ticket or merge request, or a webhook fires (a pipeline failed, a review comment). The trigger checks who asked and their quota, and turns it into a validated work item. It becomes a run tagged with the developer, the ticket and the factory's config version, with per-person limits so nobody starves the others. The run gets its own sandbox on Kubernetes from a warm pool, a model key with a budget and a repository token, both expiring with the run. The agent plans, explores and edits; for parallel edits it asks for a child run in a new sandbox on its own branch, which inherits depth, fan-out and budget limits. Tests, lint and a reviewer run in the sandbox; the branch is pushed and a merge request opened. A policy decides the path: auto-merge for low-risk changes, or a pause that posts an approval request to chat and the ticket. Branch protection enforces it even if the factory misbehaves. Spend, state, transcripts and traces are recorded.\n\nThe gate is still a person's decision: people set the risk tiers ahead of time, as data rather than prompts.\n\nIf asked what it's built on: Prefect for orchestration, PydanticAI as the agent harness, LiteLLM as the model gateway, OpenBao for secrets, OPA for policy, gVisor or Kata sandboxes, Postgres, S3-compatible storage, OpenTelemetry traces to Langfuse or Phoenix, pydantic-evals for replaying merged work. The agent is not Claude Code: that is the agent-agnostic point in practice."
},
{
 act:"Act 6 · Software factories", n:"28", title:"Open the hood", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>An interface for the whole company</div>
 <div class="body">
  <h2 style="flex:none">Anyone can see what's running,<br>and nobody's laptop has to be on.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">What anyone can see</span>
    <ul class="clean" style="gap:7px;margin-top:4px">
     <li style="font-size:14.5px">The queue, and which gate each run is waiting at</li>
     <li style="font-size:14.5px">Every run's trace: what it read, did and decided</li>
     <li style="font-size:14.5px">Cost per run, with alerts before a budget runs out</li>
     <li style="font-size:14.5px">Who asked for it, and what came out</li>
    </ul>
   </div>
   <div class="card"><span class="k">Who does this already</span><span class="v">Vercel's monitoring view of every run and the reviewers' queue. Uber's live cost counter and alerts at 50, 80 and 100% of budget. Claude Tag's admin log of every task and who asked.</span></div>
  </div>
  <div class="cols c2" style="flex:none">
   <div class="card darkc"><span class="k">Owned by the company, not a person</span><span class="v">Claude Code routines belong to one person's account, and their pull requests carry that person's name. A shared factory runs on an org API key, a service account and runners the company owns.</span></div>
   <div class="card plain"><span class="k">The rules come with it</span><span class="v">Gates written down as data. A budget and a turn limit per run. Every ticket, issue and comment treated as untrusted input.</span></div>
  </div>
 </div>`,
 notes:"This is what changes for the company, not just the developer. Today, what an agent did lives in one person's terminal. In a factory it lives in a shared place: the queue, the trace, the cost, the gate. A product owner can see why a ticket is waiting; a lead can see what a run cost; anyone can read what the agent did and why. That is more agency for the company and less dependency on any one person.\n\nExamples: Vercel runs a monitoring UI that tracks every run and shows the queue for the reviewers. Uber shows a live cost counter in the harness status line, flags 16 anti-patterns with their cost, and alerts at 50, 80 and 100% of expected spend. Claude Tag lets admins view a log of everything @Claude did and who requested each task. Jira shows agent sessions in one view.\n\nThe caveat that matters: Claude Code routines belong to an individual claude.ai account, are not shared with teammates, and their commits and pull requests carry that person's GitHub user. That's fine for your own automations; it is the opposite of a company factory. For shared use, the GitHub Action docs say to use an org API key or OIDC, because an OAuth token is tied to the subscription of whoever created it.\n\nThe rules: gates as data (eCrop's risk tiers), caps per run (--max-budget-usd and --max-turns), and security. Prompt injection through issues and comments is a documented, repeated attack on AI agents in CI (Invariant 2025, Aikido's PromptPwnd December 2025, SecurityWeek April 2026). Vercel's rule: every issue, pull request, comment and link is untrusted."
},
{
 act:"Act 6 · Software factories", n:"29", title:"The building blocks you already have", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Start small, with what you have</div>
 <div class="body">
  <h2 style="flex:none">Most of a factory is already in Claude Code.</h2>
  <table style="flex:none;font-size:14px">
   <tr><th>Part</th><th>In Claude Code today</th></tr>
   <tr><td class="ok">Triggers</td><td>Routines on a schedule, an API call, or GitHub pull request and release events · the Claude Code GitHub Action on any GitHub event</td></tr>
   <tr><td class="ok">Runs</td><td><code>claude -p</code> in CI or a container · the Agent SDK · Managed Agents · your saved workflows from Day 4</td></tr>
   <tr><td class="ok">Gates</td><td>Plan approval · Claude Code Review · the SonarQube quality gate over MCP · Day 3's no-merge hook · branch protection</td></tr>
   <tr><td class="ok">Caps</td><td><code>--max-budget-usd</code> and <code>--max-turns</code> per run · a limit on CI rounds</td></tr>
   <tr><td class="ok">Seeing it</td><td>OpenTelemetry into your Grafana: cost, tokens and pull requests per run · cost in the JSON output</td></tr>
  </table>
  <div class="cols c2" style="flex:none">
   <div class="card darkc"><span class="k">The smallest factory</span><span class="v">A GitHub Action that picks up an issue labelled <code>factory</code>, runs your loop, and stops at a pull request you read in the morning.</span></div>
   <div class="card plain"><span class="k">Or buy one</span><span class="v">Factory sells it ready-made, in the cloud or self-hosted. Owning yours means your rules, your data, your models, and more to run.</span></div>
  </div>
 </div>`,
 notes:"Keep it practical: almost nothing here is new to them.\n\nTriggers: routines run in Anthropic's cloud on a schedule (at least an hour apart), from an API call with a token, or on GitHub pull request and release events. The Claude Code GitHub Action runs on any GitHub event, including schedule and repository_dispatch, on their own runners. For shared use, give it an org API key.\n\nRuns: claude -p with --bare is the scripted form. The Agent SDK is the same loop as a library; the GitHub Action is built on it. Managed Agents host sessions for you and are what Sentry and Atlassian built their integrations on. In print mode the ultracode keyword does not start a workflow; allow a saved one by name with the permission rule Workflow(name).\n\nGates: SonarSource's official MCP server has get_project_quality_gate_status, so the quality gate they already run becomes a gate the agent must pass.\n\nSeeing it: Claude Code exports OpenTelemetry metrics, which can land in the Grafana they are building. The JSON output's total_cost_usd is an estimate.\n\nThe smallest factory is worth ending on: one Action, one label, one pull request in the morning. If that works for a month, add the next stage.\n\nBuying: Factory (factory.com), Factory 2.0 on 15 June 2026: Droids, Missions, a model router, cloud or self-hosted, bring your own key; valued at $5B in September. Owning: the advantage is control, which matters for a company whose clients trust it with their code."
},

 act:"Act 7 · Build on what exists", n:"31", title:"Claude Design on your front end", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>You asked during the week · quick mockups on what you already have</div>

  <h2 style="flex:none">Mock it up on your own look,<br>before anyone writes the component.</h2>

  </div>
 </div>`,
 notes:"This was asked for during the week, and it closes the loop Filipe named on Day 2: prototype first, then a better spec.\n\nClaude Design launched on 17 April 2026 from Anthropic Labs. It is a beta, on by default for Pro, Max and Team, and since 17 June it shares the normal usage limits. Owners can switch it off in organisation settings.\n\nBringing the look: there are three ways to create a design system. From chat with files and screenshots; by importing from GitHub or a local folder, through Anthropic's read-only Claude Design Import app, where it reads component structure, styling and theming; or with /design-sync in Claude Code, which is documented for React only. The docs suggest linking one package or directory rather than a whole repository. For Angular: point it at the theme folder (the SCSS palettes and typography) and a few component folders, and add screenshots of the running app.\n\nThe Angular catch, plainly: nothing documents Angular support. The product page says the code path works best for existing React design systems. A reported issue shows /design-sync on a non-React repo writing .jsx files and failing, with no early error. So Claude Design gives you your look, drawn as HTML; turning it into real mat- components is Claude Code's job, next slide.\n\n/design in Claude Code is a research preview (August 2026): artboards on one canvas, published as a design artifact, each artboard exportable as PNG or PDF."
},
{
 act:"Act 7 · Build on what exists", n:"32", title:"The design feeds the loop", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>The time spent designing isn't lost in development</div>
 <div class="body">
  <h2 style="flex:none">The mockup becomes the intent.</h2>
  <div class="loopdiag" style="flex:none">
   <span class="loopstep" style="font-size:14px">Prototype in Claude Design</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">Export · hand off to Claude Code, or the zip</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px"><code>docs/design/WALL-42/</code></span><span class="loopar">→</span>
   <span class="loopstep" style="background:var(--primary);color:#fff;font-size:14px"><code>/intent</code> links it</span><span class="loopar">→</span>
   <span class="loopstep" style="font-size:14px">your loop</span>
  </div>
  <table style="flex:none;font-size:14px">
   <tr><th>Step of your loop</th><th>What the design gives it</th></tr>
   <tr><td class="ok"><code>/intent</code></td><td>The bundle's README and the screenshots: what the screen is for, and what it should look like</td></tr>
   <tr><td class="ok"><code>/spec</code></td><td>Every state the prototype shows: empty, loading, error, full</td></tr>
   <tr><td class="ok"><code>/plan</code></td><td>Each element mapped to a <code>mat-</code> component and a theme token</td></tr>
   <tr><td class="ok"><code>/execute</code></td><td>Built, then checked against the screenshots with Claude in Chrome</td></tr>
   <tr><td class="ok"><code>/ship</code></td><td>The pull request links the Jira ticket and the design folder</td></tr>
  </table>
  <div class="foot">Rehearse the handoff once. If the pasted prompt can't open the design, download the zip, unzip it into the folder, and point Claude at its README.</div>
 </div>`,
 notes:"The point of this slide: the cost of designing doesn't get paid twice. The design is not redrawn from memory in development; it becomes the input of the loop they built on Day 2.\n\nThe documented part: Export, then Hand off to Claude Code, bundles the project's design files, the chat and a README that tells the model how to read the designs, and gives you a prompt to paste into local Claude Code with the bundle's URL. There is also Send to Claude Code Web. Claude Code reads images by path, paste or drag, and the docs' own example is generating CSS to match a mockup.\n\nThe suggested part, which is ours: save the bundle and the PNGs under docs/design/ with the ticket key; have /intent link the README and the screenshots and name the Material components to use; the spec lists the states; the plan maps each prototype element to a mat- component and a theme token, which is where Angular Material's real components come in; execute, then compare the running page against the screenshots with Claude in Chrome (claude --chrome, generally available since July); /ship links the Jira issue. Keep the prototype HTML out of the build.\n\nThe caveat: on at least one version the pasted prompt failed because local Claude Code couldn't fetch the authenticated design URL. The workaround is Download zip, unzip into the folder, and 'Implement the design in ./design-bundle, see the README inside for intent'. Rehearse it before relying on it.\n\nGuide 5 has the quick version on the wall: /design, implement, watch it reload, three rounds."
},

 act:"Act 7 · Build on what exists", n:"33", title:"Reuse before you write", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>You raised this during the week · duplication</div>
 <div class="body">
  <h2 style="flex:none">The agent writes it again when it already exists.<br>Check for reuse at three moments.</h2>
  <div class="cols c2" style="flex:none;gap:14px">
   <div class="card plain" style="padding:12px 18px"><span class="v" style="font-size:14px"><strong>8×</strong> more duplicated blocks in 2024, the first year copy and paste outgrew refactoring</span><span class="xs" style="margin-top:4px">GitClear, 211M changed lines · self-reported</span></div>
   <div class="card plain" style="padding:12px 18px"><span class="v" style="font-size:14px"><strong>1.87×</strong> more redundant code from agents than from people: they "disregard code reuse opportunities"</span><span class="xs" style="margin-top:4px">MSR 2026, peer-reviewed · Python only</span></div>
  </div>
  <div class="cols c3" style="flex:none;gap:14px">
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">1 · Before, in /plan</span><span class="v" style="font-size:14px">Add a reuse step to your plan skill: search the shared modules first, with the code graph. The plan lists the existing code it considered, and why it reuses it or not.</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">2 · After, before the PR</span><span class="v" style="font-size:14px"><code>/code-review</code> flags reuse and simplification on your diff; <code>/simplify</code> applies the cleanups. In CI, SonarQube's gate on duplicated new code, and jscpd failing only on new copies.</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">3 · Every week, an architect</span><span class="v" style="font-size:14px">A scheduled Action with Claude Code reads the duplication reports, groups the copies by concern, and opens one small refactoring PR per group. You accept or close each one.</span></div>
  </div>
  <div class="card darkc" style="flex:none;padding:14px 20px"><span class="k">Don't over-correct</span><span class="v">Wait for the third copy before you abstract. "Duplication is far cheaper than the wrong abstraction." Tools find copies cheaply and reliably. Code that does the same thing written differently mostly needs a model, and costs more. A person decides what gets centralised.</span></div>
 </div>`,
 notes:"They raised this during the week: similar code keeps getting written again, not only components but whole layers, and the agent rarely stops to check whether the problem is already solved. It's a measured problem, and the answer is the same shape as the rest of the week: guides before the agent acts, sensors after, and a periodic job for the drift that builds up slowly.\n\nThe evidence. GitClear's 2025 report (211 million changed lines, 2020 to 2024; covered by DevClass on 20 February 2025): blocks with five or more duplicated lines rose eightfold during 2024, copy and paste went from 8.3% to 12.3% of changed lines, moved (refactored) code fell from 25% to under 10%, and 2024 was the first year copy and paste exceeded moved code. Their 2026 update reports duplicated blocks up another 81%. Both are a vendor's correlations: self-reported. The peer-reviewed one: Huang et al., MSR 2026 (arXiv 2601.21276): agents produced 1.87 times more redundancy than humans, p below 0.001, on Python only. OpenAI's harness engineering post (February 2026) says Codex replicates the patterns already in the repository, uneven ones included, and the team spent every Friday cleaning up.\n\n1. Before: this is the cheapest place. Anthropic's own best practices say explore first, then plan, then code, and reference existing patterns; their example prompt asks subagents to find existing utilities to reuse. Add to the plan skill a section called 'Existing code considered', filled by searching the shared Angular library, the common Java module and the FastAPI utilities with codegraph. Anthropic's official feature-dev plugin does this in its explore phase and offers a 'maximum reuse' design option. A CLAUDE.md line helps but is advisory; the plan section is what you review at the gate.\n\n2. After: the /code-review docs say it reports correctness bugs and reuse, simplification and efficiency cleanups; it runs as a background subagent, and --fix applies findings outside your checkpoints, so revert with git. /simplify runs a cleanup-only review that applies fixes without hunting for bugs. In CI: SonarQube's Sonar way gate allows at most 3.0% duplication on new code, ignored below 20 new lines, and a Java duplicate block needs 10 statements; PR analysis needs Developer Edition or above (ask which they run). jscpd (MIT) can fail only on new clones against a baseline and has a GitHub Action with SARIF output. PMD CPD covers Java and TypeScript too, with a Maven cpd-check goal.\n\n3. Every week: Birgitta Böckeler (martinfowler.com, 2 April 2026) separates computational sensors, which catch duplicate code reliably, from LLM checks, which catch semantic duplicates 'expensively and probabilistically', and asks what drift should be watched by sensors running outside the change lifecycle. OpenAI runs background tasks that open targeted refactoring pull requests. For Carrot: a scheduled GitHub Action with the Claude Code action reads SonarQube's duplication tools through its MCP server (search_duplicated_files, get_duplications) and a jscpd report, groups clones by concern, and opens one small PR or issue per group. ThoughtWorks' Radar (April 2026) warns the first scan surfaces a large number of violations: triage, keep fixes small. ArchUnit (Java) and Nx or dependency-cruiser (Angular) don't find duplicates, but they say where shared code must live.\n\nThe counterweight: Anthropic's own prompting guide says don't create helpers or abstractions for one-time operations. The rule of three (Fowler, Refactoring) and Sandi Metz's 'duplication is far cheaper than the wrong abstraction' (2016). This is a factory-shaped job, so it belongs in the same place as the rest: an agent proposes, a person decides."
},

 act:"Act 8 · Your tools, connected", n:"35", title:"At your desk", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Not Claude Code: Claude, connected to what you already use</div>
 <div class="body">
  <h2 style="flex:none">Connect the tools you open every day.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th style="width:190px">You use</th><th style="width:330px">Connect it</th><th>Then ask</th></tr>
   <tr><td class="ok">Outlook, Teams, SharePoint</td><td>The Microsoft 365 connector. An owner turns it on, a Microsoft admin approves it</td><td>"What did we decide in yesterday's meeting, and what do I owe?"</td></tr>
   <tr><td class="ok">Jira</td><td>Cloud: the Atlassian connector. Data Center: the <code>acli</code> CLI or a community server</td><td>"Split this spec into three tickets." "What's blocking CAR-123?"</td></tr>
   <tr><td class="ok">Meetings</td><td>Granola: no bot joins, works with Teams calls and in person</td><td>"What did the client ask for across last week's calls?"</td></tr>
   <tr><td class="ok">Quick demos</td><td>Claude Design</td><td>"Mock the new report screen from this screenshot."</td></tr>
   <tr><td class="ok">Your browser</td><td>Claude in Chrome, or <code>claude --chrome</code> from the terminal</td><td>"Open localhost:4200, click through the flow, read the console."</td></tr>
   <tr><td class="ok">Recurring chores</td><td>Claude Cowork, on a schedule</td><td>"Every Friday, draft my status from Jira and Teams."</td></tr>
  </table>
  <div class="foot">Connectors that can send, like Outlook and Teams, ask before each action by default. Keep it that way: an email or a ticket can carry instructions meant for the agent.</div>
 </div>`,
 notes:"This is about their personal workflow, outside Claude Code. On their Team plan, connectors are added in claude.ai by an admin and then show up in Claude, Cowork and Claude Code.\n\nMicrosoft 365: the connector is made by Anthropic and covers SharePoint, OneDrive, Outlook and Teams chat. A Team owner enables it and an Entra global admin grants tenant consent. Write actions (mail, calendar, files, Teams messages) are controlled by the admin. Its permission list includes meeting transcripts; how well that works in practice, test it.\n\nJira: the Atlassian connector is Atlassian's Rovo MCP server, read and write, Jira Cloud only; some tools spend Rovo credits. If Carrot runs Data Center, use acli (Atlassian's CLI, documented for Cloud; check Data Center) or the community mcp-atlassian server with a personal access token. The ticket key in the example is invented.\n\nGranola captures the laptop's audio, so no bot joins, on Zoom, Meet, Teams and in person, on macOS, Windows and mobile. Its connector is read-only and works in Claude Code too. The free plan keeps 30 days.\n\nClaude in Chrome: the extension is a beta on paid plans, with admin allow and block lists; the Claude Code integration went GA in July.\n\nCowork: on Team, cloud sessions, the browser, Auto mode and connector approvals are on by default. Good for scheduled non-code work.\n\nThe footer is the one safety rule: keep 'ask before sending' on. An incoming email can carry a prompt injection."
},
{
 act:"Act 8 · Your tools, connected", n:"36", title:"In your stack", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>The systems behind your code</div>
 <div class="body">
  <h2 style="flex:none">And the systems your code runs on.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th style="width:190px">You run</th><th style="width:330px">Connect it</th><th>Then ask</th></tr>
   <tr><td class="ok">GitHub</td><td>The GitHub connector, or <code>gh</code> in Claude Code</td><td>"Why did this Action fail, and what changed since the last green run?"</td></tr>
   <tr><td class="ok">SonarQube</td><td>SonarSource's official MCP server, read-only</td><td>"Why did my PR fail the quality gate? Fix it."</td></tr>
   <tr><td class="ok">Grafana and Prometheus</td><td>Grafana's official MCP server, with writes disabled</td><td>"What happened to p95 latency after yesterday's deploy?"</td></tr>
   <tr><td class="ok">Kubernetes</td><td>The Kubernetes MCP server, read-only</td><td>"Why does this pod keep restarting?"</td></tr>
   <tr><td class="ok">PostgreSQL</td><td>Google's MCP Toolbox for Databases, on a dev database with a read-only role</td><td>"Explain this slow query and suggest an index."</td></tr>
   <tr><td class="ok">Angular and Quarkus</td><td>The Angular CLI's MCP server and the Quarkus agent MCP server</td><td>"Run the tests." "Search the docs for this version."</td></tr>
  </table>
  <div class="foot">Start read-only, and check which cluster or database each one points at. Anyone can add a local server with <code>claude mcp add</code>; claude.ai connectors are added by an admin.</div>
 </div>`,
 notes:"Every row here was checked on 28 September 2026. Start each one read-only.\n\n- GitHub: the connector is published by GitHub; the server is github/github-mcp-server, with a read-only mode. In Claude Code, gh is often lighter.\n- SonarQube: SonarSource/sonarqube-mcp-server, Docker image sonarsource/sonarqube-mcp, with claude mcp add commands in the README for Cloud and Server. It needs a user token; SONARQUBE_READ_ONLY=true blocks writes.\n- Grafana: grafana/mcp-grafana, with a service-account token; query_prometheus and Loki queries; --disable-write. Grafana 9 or later. Large dashboards eat context.\n- Kubernetes: containers/kubernetes-mcp-server, with --read-only and --disable-destructive. It uses the current kubeconfig context, so check it isn't production.\n- PostgreSQL: there is no official server and the old reference server is archived. Google's MCP Toolbox for Databases has a prebuilt Postgres mode (npx -y @toolbox-sdk/server --prebuilt=postgres --stdio). Dev databases and read-only roles only.\n- Angular: npx @angular/cli mcp, with list_projects, best practices, docs search and run_target for build, test and lint; --read-only is available.\n- Quarkus: quarkusio/quarkus-agent-mcp (Apache-2.0), installed with claude mcp add -s user quarkus-agent -- jbang quarkus-agent-mcp@quarkusio: dev mode, tests, docs, and the Dev MCP of a running app.\n\nIf they adopt Sentry, its official MCP server can also trigger Seer fixes."
},
{
 act:"Act 8 · Your tools, connected", n:"37", title:"Worth investigating next", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Where we would look next, at Carrot</div>
 <div class="body">
  <h2 style="flex:none">Six things worth investigating.</h2>
  <div class="cols c3" style="flex:none;gap:14px">
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">1 · A team harness</span><span class="v" style="font-size:14px">Rules, skills, hooks and the loop, agreed together and kept in one repository, changed by pull request like code.</span><span class="xs" style="margin-top:6px">Start: the best pieces of your forks</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">2 · AI review in CI</span><span class="v" style="font-size:14px">Claude Code Review or Cursor Bugbot commenting on every pull request, with your own review rules in a file.</span><span class="xs" style="margin-top:6px">Start: one repository, reviews on request</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">3 · Scheduled agents</span><span class="v" style="font-size:14px">Research, architecture review, security review and production monitoring on your layers, on a schedule, opening tickets or small pull requests.</span><span class="xs" style="margin-top:6px">Start: one weekly architecture sweep</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">4 · Claude Design</span><span class="v" style="font-size:14px">Quick mockups and UX and UI design on your own Angular look, handed straight into the loop.</span><span class="xs" style="margin-top:6px">Start: the next ticket with a screen</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">5 · A knowledge graph</span><span class="v" style="font-size:14px">Of your product: rules, code, tickets and incidents linked. Begin with the knowledge base; add the graph when questions cross systems.</span><span class="xs" style="margin-top:6px">Start: one knowledge-compiling session</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">6 · Granola for meetings</span><span class="v" style="font-size:14px">Notes without a bot joining, on Teams calls and in person, that Claude can read when you write the intent.</span><span class="xs" style="margin-top:6px">Start: one team, two weeks</span></div>
  </div>
  <div class="card darkc" style="flex:none;padding:14px 20px"><span class="k">One at a time</span><span class="v">Pick one, run it for a few weeks, measure it, and keep it only if it helps. Same rule as all week: automate what you already trust, and a person decides.</span></div>
 </div>`,
 notes:"The practical close: six things we'd investigate if we were in their seat. Ask the room to vote for the one they'd start with.\n\n1. A team harness: everything they built this week lives in ten forks. The next step is one shared harness in a repository, with rules, skills, hooks and the five-command loop agreed together and changed by pull request, so every clone runs the same /plan. Filipe asked on Day 2 how to use this as a team: this is the answer. Start from the best pieces of their forks, and add one thing at a time.\n\n2. AI review in CI: Claude Code Review is a research preview on Team and Enterprise, runs several agents plus a verification step, averages about $15 to 25 a review from usage credits, reads REVIEW.md for repo-specific rules, and never blocks a merge. Cursor Bugbot reviews GitHub pull requests with rules in .cursor/BUGBOT.md; its docs list $40 a month for up to 200 pull requests (check current pricing). The free route is the Claude Code GitHub Action with a prompt, or /code-review --comment. Start on one repository with reviews on request, and compare what it finds against their own reviewers for a month.\n\n3. Scheduled agents: the factory act, small. A routine or a scheduled GitHub Action that researches a technology question and leaves a report; sweeps for duplication and architecture drift; runs a security review over the week's merges; or reads Grafana and Prometheus for the last window and opens a ticket when something regressed. Each one opens a ticket or a small pull request for a person to decide.\n\n4. Claude Design: on by default on their Team plan. Import the Angular Material theme and a few components, mock the next screen, and hand it into /intent, as in Guide 5.\n\n5. A knowledge graph of the product: the longest road of the six. Start with an OKF knowledge base and one knowledge-compiling session a week; move to a graph only when the questions become cross-system, multi-hop or 'what was true when'.\n\n6. Granola: captures the laptop's audio so no bot joins; works on Teams calls and in person; its connector is read-only, so it's low risk to connect. The free plan keeps 30 days. Start with one team for two weeks and see whether intents get better."
},
{
 act:"Act 9 · Close", n:"38", title:"The week in one picture", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>Five days, one pattern</div>
 <div class="body">
  <h2 style="flex:none">Find the bottleneck. Move it into a file.<br>Then into a system.</h2>
  <div class="cols" style="grid-template-columns:repeat(5,1fr);gap:12px;flex:none">
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">Day 1</span><span class="k">The tool</span><span class="v" style="font-size:14px">Memory in chat became CLAUDE.md and a harness.</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">Day 2</span><span class="k">The loop</span><span class="v" style="font-size:14px">Retyped prompts became five commands with contracts.</span></div>
   <div class="card" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">Day 3</span><span class="k">Superpowers</span><span class="v" style="font-size:14px">Copy and paste from outside became CLIs, MCP, rules and hooks.</span></div>

   <div class="card darkc" style="padding:16px 18px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--amber)">Day 5</span><span class="k">Knowledge and the factory</span><span class="v" style="font-size:14px">Exploring became knowing, and one laptop became a factory.</span></div>

 </div>`,

/* ---------- render ---------- */
const stage=document.getElementById('stage');
D.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.dark?' dark':'')+(s.coral?' coral':'');
  el.dataset.i=i;
  el.innerHTML=s.html;
  stage.appendChild(el);
});
const slides=[...document.querySelectorAll('.slide')];
let cur=0;

function fit(){
  const w=window.innerWidth-(document.body.classList.contains('notes-on')?380:0);
  const h=window.innerHeight;
  const k=Math.min((w-48)/1280,(h-72)/720);
  stage.style.transform='scale('+k+')';
}
function show(i){
  cur=Math.max(0,Math.min(D.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  slides.forEach((el,j)=>{if(j!==cur)el.querySelectorAll('video').forEach(v=>v.pause())});
  const s=D[cur];
  document.getElementById('count').textContent=s.n+'  ·  '+(cur+1)+'/'+D.length;
  document.getElementById('actlbl').textContent=s.act.split(' · ')[0];
  document.getElementById('bar').style.width=((cur+1)/D.length*100)+'%';
  document.getElementById('n-title').textContent=s.n+' · '+s.title;
  document.getElementById('n-time').textContent=s.act+'  ·  '+s.time;
  document.getElementById('n-text').textContent=s.notes||'';
  document.getElementById('n-assets').innerHTML=s.gap?'<b>Gap:</b> '+s.gap:'<b>Assets:</b> complete';
  const nx=D[cur+1];
  document.getElementById('n-next').innerHTML=nx?'Next<b>'+nx.n+' · '+nx.title+'</b>':'Next<b>end of deck</b>';
  [...document.querySelectorAll('.ovcell')].forEach((c,j)=>c.classList.toggle('cur',j===cur));
  location.hash=s.n;
}
/* overview */
const og=document.getElementById('ovgrid');
D.forEach((s,i)=>{
  const c=document.createElement('div');
  c.className='ovcell';
  c.innerHTML='<span class="n">'+s.n+'</span><span class="t">'+s.title+'</span>'+
    (s.gap?'<span class="flag">gap</span>':'')+'<span class="a">'+s.act.split(' · ')[0]+'</span>';
  c.onclick=()=>{show(i);toggle('overview',false)};
  og.appendChild(c);
});
function toggle(id,on){
  const el=document.getElementById(id);
  el.classList.toggle('on',on===undefined?!el.classList.contains('on'):on);
}
function notes(){document.body.classList.toggle('notes-on');fit()}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='Escape'){toggle('overview',false);toggle('help',false);return}
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'){e.preventDefault();show(cur+1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();show(cur-1)}
  else if(k==='Home'){show(0)} else if(k==='End'){show(D.length-1)}
  else if(k==='n'||k==='N'){notes()}
  else if(k==='o'||k==='O'){toggle('overview')}
  else if(k==='?'){toggle('help')}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(/^[1-9]$/.test(k)){
    const t=D.findIndex(s=>s.act.startsWith('Act '+k));
    if(t>=0)show(t);
  }
});
document.querySelectorAll('#hud button').forEach(b=>{
  b.onclick=()=>{const g=b.dataset.go;
    if(g==='next')show(cur+1); else if(g==='prev')show(cur-1);
    else if(g==='notes')notes(); else if(g==='overview')toggle('overview'); else toggle('help');
  };
});
window.addEventListener('resize',fit);
const start=D.findIndex(s=>s.n===location.hash.replace('#',''));
fit();show(start>=0?start:0);
</script>
</body>
</html>
