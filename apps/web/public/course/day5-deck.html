<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 5 · Knowledge and the factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#cc785c; --primary-active:#a9583e;
  --ink:#141413; --body:#3d3d3a; --body-strong:#252523;
  --muted:#6c6a64; --muted-soft:#8e8b82;
  --hairline:#e6dfd8; --hairline-soft:#ebe6df;
  --canvas:#faf9f5; --surface-soft:#f5f0e8; --surface-card:#efe9de; --cream-strong:#e8e0d2;
  --dark:#181715; --dark-elev:#252320; --dark-soft:#1f1e1b;
  --on-dark:#faf9f5; --on-dark-soft:#a09d96;
  --teal:#5db8a6; --amber:#e8a55a; --success:#5db872; --warning:#d4a017; --error:#c64545;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  overflow:hidden;
}

/* ---------- stage ---------- */
#stage-wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--canvas)}
body.notes-on #stage-wrap{inset:0 380px 0 0}
#stage{
  width:1280px;height:720px;position:relative;
  transform-origin:center center;
  background:var(--canvas);
  box-shadow:0 1px 3px rgba(20,20,19,.08);
  overflow:hidden;
}
.slide{
  position:absolute;inset:0;display:none;
  padding:56px 64px;
  flex-direction:column;
}
.slide.active{display:flex}
.slide.dark{background:var(--dark);color:var(--on-dark)}
.slide.dark .eyebrow{color:var(--on-dark-soft)}
.slide.dark h1,.slide.dark h2{color:var(--on-dark)}
.slide.dark p,.slide.dark li{color:var(--on-dark-soft)}
.slide.coral{background:var(--primary);color:#fff}
.slide.coral h1,.slide.coral h2,.slide.coral p{color:#fff}

/* ---------- type ---------- */
.eyebrow{
  font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:20px;display:flex;gap:12px;align-items:center;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);flex:none}
h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:1.05;letter-spacing:-1.4px;color:var(--ink)}
h2{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.1;letter-spacing:-1px;color:var(--ink)}
h3{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.15;letter-spacing:-.5px;color:var(--ink)}
.lead{font-size:20px;line-height:1.45;color:var(--body-strong);font-weight:400}
p{font-size:17px;color:var(--body)}
.sm{font-size:15px}
.xs{font-size:13.5px;color:var(--muted)}
strong{font-weight:600;color:var(--ink)}
.slide.dark strong{color:var(--on-dark)}
em.q{font-style:italic;font-family:var(--serif);font-size:1.1em;letter-spacing:-.2px}
.coralword{color:var(--primary)}
.slide.dark .coralword{color:var(--amber)}

/* ---------- layout helpers ---------- */
.body{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0;justify-content:center}
.cols{display:grid;gap:26px;flex:1;min-height:0}
.c2{grid-template-columns:1fr 1fr}
.c2w{grid-template-columns:1.15fr .85fr}
.c2n{grid-template-columns:.82fr 1.18fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;justify-content:center}
.center{justify-content:center;align-items:flex-start}
.mid{justify-content:center}

/* ---------- cards ---------- */
.card{background:var(--surface-card);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px}
.card.plain{background:transparent;border:1px solid var(--hairline)}
.card.darkc{background:var(--dark);color:var(--on-dark)}
.card.darkc h3,.card.darkc .k{color:var(--on-dark)}
.card.darkc p,.card.darkc .v{color:var(--on-dark-soft)}
.card.darkc .v strong{color:var(--on-dark)}
.card .k{font-size:16px;font-weight:600;color:var(--ink)}
.card .v{font-size:15px;color:var(--body);line-height:1.5}
.stat{font-family:var(--serif);font-size:56px;line-height:1;letter-spacing:-2px;color:var(--primary);font-weight:500}
.slide.dark .stat{color:var(--amber)}

.hrm{display:grid;grid-template-columns:104px 1fr;gap:10px 18px;align-items:baseline}
.hrm .lbl{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted-soft);padding-top:4px}
.hrm .lbl.move{color:var(--primary)}
.hrm .txt{font-size:17px;color:var(--body);line-height:1.45}
.hrm .txt strong{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13.5px;background:var(--surface-card);color:var(--ink);border-radius:9999px;padding:5px 13px}
.slide.dark .chip{background:var(--dark-elev);color:var(--on-dark)}
.pill{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;border-radius:9999px;padding:4px 11px;background:var(--surface-card);color:var(--ink)}
.pill.coral{background:var(--primary);color:#fff}
.pill.warn{background:#f6e6c8;color:#7a5a08}
.pill.term{background:var(--dark);color:var(--on-dark)}

blockquote{
  border-left:2px solid var(--primary);padding-left:20px;
  font-family:var(--serif);font-size:27px;line-height:1.28;letter-spacing:-.4px;color:var(--ink);font-weight:500;
}
.slide.dark blockquote{color:var(--on-dark)}
blockquote cite{display:block;font-family:var(--sans);font-size:13px;font-style:normal;color:var(--muted);margin-top:12px;letter-spacing:0;font-weight:500}
.slide.dark blockquote cite{color:var(--on-dark-soft)}

/* ---------- assets ---------- */
figure{margin:0;display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
figure img{
  width:100%;height:100%;object-fit:cover;object-position:top left;
  border-radius:12px;border:1px solid var(--hairline);background:var(--dark);
  display:block;min-height:0;
}
figure img.contain{object-fit:contain;object-position:center;background:var(--dark)}
figure img.bottom{object-position:bottom left}
figcaption{font-size:12px;color:var(--muted-soft);font-family:var(--mono);flex:none}
.slide.dark figcaption{color:var(--on-dark-soft)}
.shotgrid{display:grid;gap:12px;flex:1;min-height:0}
figure.vid{flex:none}
figure.vid video{height:380px}
video{width:100%;border-radius:12px;background:#000;object-fit:contain;display:block}

.missing{
  position:absolute;top:18px;right:22px;z-index:5;
  font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;
  background:#f6e6c8;color:#7a5a08;border-radius:9999px;padding:5px 12px;
  display:flex;gap:7px;align-items:center;cursor:default;
}
.slide.dark .missing{background:#4a3c18;color:#f0dcae}
.gapnote{
  background:#faf1dd;border-left:2px solid var(--warning);border-radius:0 8px 8px 0;
  padding:11px 15px;font-size:13.5px;color:#6b5410;line-height:1.45;flex:none;
}
.slide.dark .gapnote{background:#2a2317;color:#d8c38c;border-color:var(--amber)}
.gapnote b{color:#4a3a06}
.slide.dark .gapnote b{color:#f0dcae}

/* ---------- chrome ---------- */
#chrome{position:fixed;left:0;right:0;bottom:0;height:0;z-index:40}
body.notes-on #chrome{right:380px}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--primary);transition:width .22s ease;z-index:41}
#hud{
  position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:14px;
  align-items:center;pointer-events:none;z-index:42;
}
body.notes-on #hud{right:380px}
#hud .grp{
  pointer-events:auto;display:flex;gap:2px;align-items:center;
  background:rgba(250,249,245,.94);border:1px solid var(--hairline);border-radius:9999px;padding:4px;
  backdrop-filter:blur(8px);
}
#hud button{
  border:0;background:transparent;color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;
  padding:6px 12px;border-radius:9999px;cursor:pointer;
}
#hud button:hover{background:var(--surface-card);color:var(--ink)}
#hud .count{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 12px;min-width:86px;text-align:center}
#hud .act{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary);padding:0 10px}

/* ---------- notes ---------- */
#notes{
  position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--dark);color:var(--on-dark);
  padding:26px 24px;overflow-y:auto;display:none;z-index:45;border-left:1px solid #000;
}
body.notes-on #notes{display:block}
#notes h4{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
#notes .nslide{font-family:var(--serif);font-size:24px;letter-spacing:-.4px;color:var(--on-dark);margin-bottom:6px;font-weight:500}
#notes .ntime{font-family:var(--mono);font-size:12px;color:var(--on-dark-soft);margin-bottom:20px}
#notes .ntext{font-size:14.5px;line-height:1.62;color:#d6d2ca;white-space:pre-wrap}
#notes .nassets{margin-top:22px;padding-top:18px;border-top:1px solid #333029;font-size:13px;color:var(--on-dark-soft);line-height:1.6}
#notes .nassets b{color:var(--amber);font-weight:600}
#notes .nnext{margin-top:22px;padding-top:18px;border-top:1px solid #333029;font-size:13px;color:var(--on-dark-soft)}
#notes .nnext b{color:#fff;display:block;margin-top:4px;font-family:var(--serif);font-size:17px;letter-spacing:-.3px}

/* ---------- overview ---------- */
#overview{
  position:fixed;inset:0;background:rgba(250,249,245,.985);z-index:60;display:none;
  overflow-y:auto;padding:40px 44px;
}
#overview.on{display:block}
#overview h3{margin-bottom:22px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.ovcell{
  border:1px solid var(--hairline);border-radius:10px;background:var(--surface-soft);
  padding:12px 13px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:6px;
}
.ovcell:hover{border-color:var(--primary)}
.ovcell.cur{border-color:var(--primary);background:var(--surface-card)}
.ovcell .n{font-family:var(--mono);font-size:11px;color:var(--muted-soft)}
.ovcell .t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.3}
.ovcell .a{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--primary);font-weight:600;margin-top:auto}
.ovcell .flag{font-size:10px;color:#7a5a08;background:#f6e6c8;border-radius:9999px;padding:2px 7px;align-self:flex-start}

/* ---------- help ---------- */
#help{position:fixed;inset:0;background:rgba(20,20,19,.72);z-index:70;display:none;place-items:center}
#help.on{display:grid}
#help .box{background:var(--canvas);border-radius:16px;padding:34px 38px;max-width:460px}
#help h3{margin-bottom:18px}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:14.5px}
#help dt{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface-card);padding:2px 9px;border-radius:5px;justify-self:start}
#help dd{color:var(--body)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted-soft);padding:0 12px 9px 0;border-bottom:1px solid var(--hairline)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--hairline-soft);color:var(--body);vertical-align:top}
td.mono{font-family:var(--mono);font-size:13px;color:var(--ink)}
td.ok{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:0}

ul.clean{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.clean li{font-size:16.5px;color:var(--body);padding-left:18px;position:relative;line-height:1.45}
ul.clean li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--primary)}
ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
ol.steps li{counter-increment:s;font-size:18px;color:var(--body);padding-left:42px;position:relative;line-height:1.4}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;font-family:var(--sans);
}
.vidhead{display:flex;justify-content:space-between;align-items:center;gap:24px;flex:none;margin-bottom:12px}
.vidhead .eyebrow{margin-bottom:0}
.qrinline{display:flex;gap:13px;align-items:center}
.qrinline img{width:96px;height:96px;border-radius:8px;background:var(--canvas);padding:4px;display:block}
.qrinline .lbl{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--on-dark-soft);margin-bottom:4px}
.qrinline .url{display:block;font-family:var(--mono);font-size:14px;color:var(--amber)}
.qr{width:168px;height:168px;border-radius:12px;flex:none;background:var(--canvas);padding:6px}
figure.noimg img,figure.noimg figcaption{display:none}
figure.noimg::before{content:"bizpliz-hero.png";display:grid;place-items:center;flex:1;border:2px dashed var(--hairline);border-radius:12px;font-family:var(--mono);font-size:12px;color:var(--muted-soft)}
.slide.dark .qr{border-color:#3a352d;color:var(--on-dark-soft)}
.logorow{display:flex;gap:26px;align-items:center;margin-top:auto}
.logoplate{
  margin-top:auto;align-self:flex-start;display:flex;align-items:center;gap:30px;
  background:var(--canvas);border-radius:12px;padding:18px 30px;
}
.logoplate img{display:block;width:auto}
.logoplate .lsep{width:1px;align-self:stretch;background:var(--hairline)}
.logoslot{
  height:42px;min-width:108px;border-radius:8px;border:1px dashed #3a352d;
  display:grid;place-items:center;font-size:10.5px;color:var(--on-dark-soft);font-family:var(--mono);padding:0 14px;
}
.slide:not(.dark) .logoslot{border-color:var(--hairline);color:var(--muted-soft)}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hairline);font-size:13px;color:var(--muted);flex:none}
.slide.dark .foot{border-color:#2c2823;color:var(--on-dark-soft)}
.weekmap{display:grid;grid-template-columns:1fr 1fr 1fr 106px 1fr 1fr;gap:11px;align-items:stretch}
.day{background:var(--surface-card);border-radius:12px;padding:19px 17px;display:flex;flex-direction:column;gap:7px}
.day.gap{background:transparent;border:1px dashed var(--hairline)}
.day.dest{background:var(--primary);color:#fff}
.day .dnum{font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.day.dest .dnum{color:rgba(255,255,255,.8)}
.day .dt{font-family:var(--serif);font-size:23px;letter-spacing:-.5px;line-height:1.1;color:var(--ink);font-weight:500}
.day.dest .dt{color:#fff}
.gapweek{border:1px dashed var(--hairline);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 8px;text-align:center}
.gapweek .gw1{font-family:var(--serif);font-size:15px;line-height:1.15;letter-spacing:-.2px;color:var(--muted);font-style:italic}
.gapweek .gw2{font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-soft)}
.loopdiag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loopstep{background:var(--surface-card);border-radius:9999px;padding:10px 20px;font-size:15.5px;font-weight:500;color:var(--ink)}
.loopar{color:var(--primary);font-size:17px}
.gear{border:1px solid var(--hairline);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.gear .gn{font-size:15px;font-weight:600;color:var(--ink)}
.gear .gd{font-size:13.5px;color:var(--muted);line-height:1.45}
.modelrow{display:grid;grid-template-columns:104px 1fr;gap:6px 18px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.modelrow:last-of-type{border-bottom:0}
.modelrow .mn{font-family:var(--serif);font-size:24px;letter-spacing:-.5px;color:var(--ink);font-weight:500}
.modelrow .md{font-size:15px;color:var(--body)}
.modecycle{position:relative;flex:none;height:186px;background:var(--dark);border-radius:12px;overflow:hidden}
.mstate{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:22px 26px;opacity:0;animation:mcyc 8.4s infinite}
.mstate:nth-child(1){animation-delay:0s}
.mstate:nth-child(2){animation-delay:2.8s}
.mstate:nth-child(3){animation-delay:5.6s}
@keyframes mcyc{0%,1%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.mstate .mprompt{font-family:var(--mono);font-size:14px;color:#57534a}
.mstate .mbar{font-family:var(--mono);font-size:16.5px;font-weight:500;display:flex;gap:10px;align-items:center}
.mstate .mwhat{font-size:14px;color:var(--on-dark-soft)}
.mstate .mkey{font-family:var(--mono);font-size:12px;color:#57534a}
.mcap{flex:none;font-size:12px;color:var(--muted-soft);font-family:var(--mono);margin-top:7px}
.hooklist{display:flex;flex-direction:column;gap:7px}
.hookrow{display:flex;gap:12px;align-items:baseline;padding:9px 14px;background:var(--surface-card);border-radius:9px}
.hookrow .hx{color:var(--error);font-weight:700;font-size:14px;flex:none;line-height:1.3}
.hookrow .ht{font-size:14.5px;color:var(--ink);line-height:1.35}
.hookrow.ok{background:var(--surface-soft)}
.hookrow.ok .hx{color:var(--success)}
@media print{body{overflow:visible}.slide{display:flex!important;page-break-after:always}}
ul.tools{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:4px}
ul.tools li{font-size:13.5px;line-height:1.42;color:var(--body);padding-left:14px;position:relative}
ul.tools li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--primary)}
ul.tools li strong{color:var(--ink);font-weight:600}
.card.tcard{padding:15px 20px;gap:3px}
.card.tcard .sub{font-size:13px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>

<div id="stage-wrap"><div id="stage"></div></div>
<div id="bar"></div>
<div id="hud">
  <div class="grp">
    <button data-go="prev">←</button>
    <span class="count" id="count">00 · 1/29</span>
    <button data-go="next">→</button>
  </div>
  <div class="grp"><span class="act" id="actlbl">Act 1</span></div>
  <div class="grp">
    <button data-go="notes">Notes</button>
    <button data-go="overview">All slides</button>
    <button data-go="help">?</button>
  </div>
</div>

<aside id="notes">
  <h4>Speaker notes</h4>
  <div class="nslide" id="n-title"></div>
  <div class="ntime" id="n-time"></div>
  <div class="ntext" id="n-text"></div>
  <div class="nassets" id="n-assets"></div>
  <div class="nnext" id="n-next"></div>
</aside>

<div id="overview"><h3>Day 1 · all slides</h3><div class="ovgrid" id="ovgrid"></div></div>

<div id="help"><div class="box">
  <h3>Keyboard</h3>
  <dl>
    <dt>→ ↓ Space</dt><dd>Next slide</dd>
    <dt>← ↑</dt><dd>Previous slide</dd>
    <dt>Home / End</dt><dd>First / last slide</dd>
    <dt>N</dt><dd>Speaker notes panel</dd>
    <dt>O</dt><dd>Overview of all slides</dd>
    <dt>F</dt><dd>Fullscreen</dd>
    <dt>1–9</dt><dd>Jump to act</dd>
    <dt>Esc</dt><dd>Close overlay</dd>
  </dl>
</div></div>

<script>
const SHOTS = ""; // assets sit beside this file
const D = [
{
 act:"Act 1 · Reconnect", n:"00", title:"Holding slide", time:"from −10 min",
 html:`<div class="eyebrow"><span class="dot"></span>While we wait</div>
 <div class="body">
  <div class="cols c2w" style="align-items:center">
   <div class="stack">
    <h1>Day 5. The last day.</h1>

{
 act:"Act 1 · Reconnect", n:"02", title:"News: Claude Sonnet 5.5", time:"5:00",

 <div class="body">

  <div class="cols" style="grid-template-columns:1.35fr .65fr;flex:none;align-items:start">

 </div>`,
 notes:"Open with the news, because it changes what they'll run on Monday. Anthropic released Claude Sonnet 5.5 yesterday, 28 September 2026 (anthropic.com/claude-sonnet-5-5, announced on the Claude account on X the same day). Opus 5.5 came out on 22 September.\n\nAnthropic's own framing: 'a clear upgrade over Claude Sonnet 5, runs 30%+ faster, and costs up to 30% less for most work', 'a faster, lower-cost complement to Claude Opus 5.5', 'strongest at well-scoped everyday tasks, fixing bugs, and creating polished documents'. It needs fewer tokens per task than Sonnet 5. Improvements called out: agentic coding, long-horizon work and image understanding; the first Sonnet to beat Pokémon Red working only from screenshots.\n\nThe full table from the page, all vendor-reported:\n- Terminal-Bench 4.0: Sonnet 5.5 70.6%, Sonnet 5 10.3%, Opus 5.5 66.4% (Opus at Xhigh, its highest score). The Sonnet 5 figure is a very large gap: check the chart on the page before quoting it.\n- FrontierCode 1.1 (Main), whether a change could be merged without human edits: Sonnet 5.5 52.1% at Xhigh and 46.2% at Max (it scores lower at Max), Sonnet 5 42.4%, Opus 5.5 54.4%, GPT-6 Sol 49.3%.\n- CursorBench 4.0: 55.5%, 34.1%, 57.8%.\n- GDPval-AA v2.1 (Elo, run by Artificial Analysis on a pre-release deployment): 1844, 1449, 1846, GPT-6 Sol 1487.\n- AA-Briefcase v1.1: 1811, 1359, 1822, GPT-6 Sol 1483.\n- Humanity's Last Exam with tools: 64.5%, 54.9%, 67.7%.\n- OSWorld 2.1 (partial credit): 80.1%, 57.0%, 81.8%.\n- Chartography, no tools: 61.6%, 15.6%, 64.4%, GPT-6 Sol 53.6%.\n\nPrice per million tokens: Sonnet 5.5 $2 input, $10 output, $0.20 cache reads, $2.50 cache writes; Opus 5.5 $4, $20, $0.20, $5. Model ID claude-sonnet-5-5, on the Claude Platform, the Claude apps, AWS, Google Cloud and Azure. Effort: Claude Code and the apps default to Medium, the platform to High; at High it matches GPT-6 Sol's best score for about a fifth of the cost (Anthropic's claim).\n\nSafety: cybersecurity safeguards comparable to Opus 5.5, the same biology safeguards as Sonnet 5, and the first Sonnet with classifiers that prevent reasoning extraction.\n\nFor Carrot: Atlassian says Sonnet 5.5 will let teams run their Rovo agents up to 30% faster, which matters if their Jira is Cloud. Other launch quotes came from Epic Games, CodeRabbit, Unity, Slack, Zendesk, Box, Lovable and others.\n\nThe tie-in: on Day 4 the advisor pattern was Sonnet as the main model with Opus checking the big calls. That pairing just got faster and cheaper. It also matters for today: a factory's cost per run is mostly model cost, and a cheaper model that's this close to the top one changes the maths."
},
{
 act:"Act 1 · Reconnect", n:"03", title:"Title", time:"2:00", dark:true,
 html:`<div class="eyebrow"><span class="dot"></span>Day 5 · 29 September</div>
 <div class="body mid">
  <h1 style="font-size:58px">Day 5. Knowledge and the factory.</h1>
  <p class="lead" style="color:var(--amber);font-size:23px;margin-top:8px;max-width:1010px">You know the tool and how to scale it. Today: how to give it the context of a large product, and how to take the work off one laptop and out of one person's hands.</p>
  <p class="sm" style="color:var(--on-dark-soft);margin-top:16px">Code graphs · knowledge bases · knowledge graphs · software factories · design and reuse · the tools you already use</p>
 </div>`,
 notes:"The day in one breath. Days 1 to 4 were about using the tool and scaling it on your own machine. In a large product the next limit is context: the agent spends time and tokens finding things, and still misses what is not written down. We fix that in three steps: a graph of the code, a knowledge base of what people know, and a knowledge graph of the facts behind both. Then we take the work off the laptop and out of one person's hands, into a software factory, with the gates still yours.\n\nWe close with three things asked for during the week: getting a design straight into the loop, getting the agent to reuse what exists, and connecting the tools you already use."
},
{
 act:"Act 2 · The context problem", n:"04", title:"The context problem", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>Large products</div>
 <div class="body">
  <h2 style="flex:none">Letting the agent find everything itself<br>costs you three ways.</h2>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">Time</span><span class="v">It searches and reads before it writes. In a big product that can be most of the run.</span></div>
   <div class="card"><span class="k">Tokens</span><span class="v">Every file it opens stays in the conversation and is sent again on every turn after it.</span></div>
   <div class="card"><span class="k">Gaps</span><span class="v">What lives in people's heads, tickets, calls, client documents or another repository, it never finds. So it guesses.</span></div>
  </div>
  <div class="card darkc" style="flex:none"><span class="k">What we want instead</span><span class="v">The agent starts each task already knowing where to look and what is true, and spends its tokens on the work.</span></div>
  <div class="foot">Day 1's rule was: start in the folder that holds everything the task touches. In a large product, that folder is too big to read.</div>
 </div>`,
 notes:"Make it concrete with their own experience. Ask: when did Claude last spend ten minutes reading before it wrote a line? When did it confidently apply a rule that was wrong for this client?\n\nThe three costs are the whole motivation for the day. Time and tokens are what the agent pays exploring. Gaps are worse: some knowledge is not in the repository at all, so no amount of exploring finds it.\n\nThe footer ties back to Day 1: the right folder was the first big step up. On a large product, the right folder is also the problem."
},
{
 act:"Act 2 · The context problem", n:"05", title:"Today's ladder", time:"4:00",
 html:`<div class="eyebrow"><span class="dot"></span>Today, in four steps</div>
 <div class="body">
  <h2 style="flex:none">Less exploring per task, one step at a time.</h2>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;flex:none">
   <div class="card" style="padding:18px 20px"><span class="k" style="font-size:15px">1 · Code graph</span><span class="v" style="font-size:14px">What the code is: who calls what, across files, repositories and versions.</span></div>
   <div class="card" style="padding:18px 20px;min-height:170px"><span class="k" style="font-size:15px">2 · Knowledge base</span><span class="v" style="font-size:14px">What people know: rules, decisions, the why. Written for people and agents alike.</span></div>
   <div class="card" style="padding:18px 20px;min-height:204px"><span class="k" style="font-size:15px">3 · Knowledge graph</span><span class="v" style="font-size:14px">The facts behind both, linked: rule to code, code to ticket, ticket to incident. With time.</span></div>
   <div class="card darkc" style="padding:18px 20px;min-height:238px"><span class="k" style="font-size:15px">4 · Software factory</span><span class="v" style="font-size:14px">Where it all runs: started by the company, on machines that aren't yours, with your gates.</span></div>
  </div>
  <div class="foot">Every step is optional. Each one costs effort to build and saves time and tokens on every task after it. Then three things you asked for: design into code, reuse, and your own tools.</div>
 </div>`,
 notes:"This is the map for the day. Walk it left to right once, then come back to it at each act.\n\nThe first three are about context: what the agent knows before it starts. The code graph is the cheapest, because a parser builds it. The knowledge base holds what no parser can find. The knowledge graph links the facts in both. The fourth is about where the work runs. A factory is only as good as what it knows, so the knowledge comes first.\n\nSame rule as yesterday: climb only when you need to, and only once the step below is working."
},

 act:"Act 3 · Code graphs", n:"06", title:"Part 1: Code graphs", time:"0:30", dark:true,

 <div class="body mid">
  <h1 style="font-size:66px">Code graphs.</h1>

{
 act:"Act 3 · Code graphs", n:"07", title:"What a code graph is", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>What it is</div>
 <div class="body">
  <h2 style="flex:none">A code graph lets the agent ask<br>instead of search.</h2>
  <div class="cols" style="grid-template-columns:.8fr 1.2fr;flex:none;align-items:start">
   <div class="stack" style="gap:12px">
    <div class="card"><span class="k">Nodes</span><span class="v">Files, classes, methods, routes, tables.</span></div>
    <div class="card"><span class="k">Edges</span><span class="v">Calls, imports, extends, implements, reads from, writes to.</span></div>
    <div class="card darkc"><span class="k">The question it answers</span><span class="v">"Who calls <code>approve()</code>, and what breaks if I change it?" In one query, instead of forty file reads.</span></div>
   </div>
   <table style="font-size:14.5px">
    <tr><th>How the agent finds code</th><th>Good at</th><th>The catch</th></tr>
    <tr><td class="ok">Search · grep</td><td>Exact text, always up to date</td><td>Many reads for a question that crosses files</td></tr>
    <tr><td class="ok">Embeddings</td><td>Code that looks similar</td><td>Similar is not connected; needs a vector database</td></tr>
    <tr><td class="ok">Code graph</td><td>Connections worked out in advance: several hops in one answer</td><td>Has to be kept fresh</td></tr>
   </table>
  </div>
  <div class="foot">Claude Code searches by default. A graph is something you add when searching gets slow or expensive.</div>
 </div>`,
 notes:"Keep it simple: a code graph is a map of the code, stored so the agent can ask questions of it. Nodes are the things in the code, edges are how they connect.\n\nThe table is the useful part. Claude Code finds code by searching: grep and glob, which is always fresh and very good at exact text, but a question that crosses ten files costs ten reads. Embeddings find code that looks similar, which is not the same as code that is connected, and they need an embedding pipeline and a vector database. A graph has the connections worked out in advance, so 'who calls this, and who calls them' is one answer. The price is keeping it fresh, which is the next slide.\n\nSources: codebase-memory-mcp and codegraph READMEs for node and edge types; claude-context needs an embedding key and Milvus or Zilliz."
},
{
 act:"Act 3 · Code graphs", n:"08", title:"Generate it and plug it in", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Generating it, and connecting it to Claude Code</div>
 <div class="body">
  <h2 style="flex:none">Five commands, and Claude Code asks the graph.</h2>
  <div class="cols c2" style="flex:none;align-items:start">
   <div class="stack" style="gap:10px">
    <span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-soft)">Our reference · codegraph</span>
    <div class="card darkc" style="padding:16px 20px"><pre style="margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.75;color:var(--on-dark-soft);white-space:pre">npm i -g @colbymchenry/codegraph
codegraph telemetry off
codegraph install    <span style="color:#8a847a"># adds it to Claude Code</span>
cd carrot-wall
codegraph init       <span style="color:#8a847a"># builds .codegraph/</span></pre></div>
    <span class="v" style="font-size:14px">MIT, local, Java and TypeScript. <code>install</code> registers its MCP server with Claude Code, so from the next session Claude can ask "who calls this?" instead of searching.</span>
   </div>
   <div class="stack" style="gap:12px">
    <div class="card"><span class="k">Start here: on your machine</span><span class="v">Not tracked by git. The graph describes the branch you have checked out. A file watcher keeps it fresh while you work, and a git hook re-syncs it when you switch branch.</span><code style="margin-top:6px;font-size:12.5px">.git/hooks/post-checkout → codegraph sync</code></div>
    <div class="card plain"><span class="k">Later: shared from the repository</span><span class="v">Build it in CI on every merge, or commit a compressed snapshot on a schedule. More to run, so only once a team needs the same graph.</span></div>
   </div>
  </div>
  <div class="foot">Parsing is deterministic: the same code gives the same graph, with no model and no tokens spent building it.</div>
 </div>`,
 notes:"One reference tool, so the room leaves with something to try: colbymchenry/codegraph, MIT, about 72k stars on GitHub, version 1.6.0 from 26 August 2026. It is the most starred graph built from code alone that we found (Graphify has a few thousand more stars, but it also pulls docs, papers and images in through an LLM, which is closer to the knowledge graph act).\n\nWhat the commands do, from the README: install detects Claude Code (and other agents) and adds the MCP server, codegraph serve --mcp. init creates .codegraph/ and builds the whole graph in one step. sync is the incremental update, index a full rebuild, status shows statistics. Telemetry is on by default and anonymous; turn it off with codegraph telemetry off or CODEGRAPH_TELEMETRY=0.\n\nHow it works underneath, for the curious: it parses with tree-sitter, stores the graph in SQLite (.codegraph/codegraph.db), serves it over MCP, and a native file watcher keeps it fresh.\n\nWhere it lives, the recommendation: start local and untracked. init already gitignores the folder. The graph then always describes the checkout in front of you. The watcher covers edits while it runs; for branch switches, a post-checkout git hook that runs codegraph sync is a small addition of ours (codegraph no longer installs git hooks itself). Git hooks live in .git/hooks and aren't committed; share one through a scripts folder and core.hooksPath if the team wants it. Yesterday's worktrees each get their own index.\n\nShared from the repository is the later option: build it in CI, or commit a compressed snapshot on a schedule as codebase-memory-mcp supports. One team's snapshots reached about 6 GB across 350 commits, which is why not on every commit.\n\nTry it: ask 'how does an approved post reach the database?' in a session with and without the graph, and compare /context and the number of tool calls. If Claude ignores the graph, say so in CLAUDE.md."
},
{
 act:"Act 3 · Code graphs", n:"09", title:"Across repositories and branches", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>More than one repository, more than one branch</div>
 <div class="body">
  <h2 style="flex:none">One repository is easy.<br>Many repositories and branches narrow the choice.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th style="width:200px">Tool</th><th>Repositories</th><th>Branches and versions</th><th>Links between repositories</th><th style="width:100px">Cost</th></tr>
   <tr><td class="mono">codegraph</td><td>One graph per repository</td><td>The branch you have checked out</td><td>None</td><td style="white-space:nowrap">Free · MIT</td></tr>
   <tr><td class="mono" style="white-space:nowrap">codebase-memory-mcp</td><td>Many repositories in one store</td><td>A compressed snapshot you can commit, so each branch carries its own</td><td>Cross-repository links; HTTP routes matched to their callers</td><td style="white-space:nowrap">Free · MIT</td></tr>
   <tr><td class="mono">Sourcegraph MCP</td><td>Every repository you index</td><td>Any indexed commit or tag</td><td>Precise references across repositories</td><td>Paid</td></tr>
  </table>
  <div class="cols c2" style="flex:none">
   <div class="card darkc"><span class="k">Angular to Quarkus</span><span class="v">No tool we checked is proven to link an Angular <code>HttpClient</code> call to a Quarkus endpoint. The OpenAPI file is the edge you can rely on: Quarkus writes it at build time, the Angular client is generated from it. Keep it in the repo.</span></div>
   <div class="card"><span class="k">Versions</span><span class="v">Local graphs follow whatever you check out. For every release at once, index each tag. <code>oasdiff</code> shows breaking API changes between two tags.</span></div>
  </div>
 </div>`,
 notes:"Three rows on purpose: the reference tool, the free option that goes further, and the paid one.\n\ncodegraph indexes each project on its own; a query can point at another indexed project, but there are no edges between them.\n\ncodebase-memory-mcp (DeusData, MIT, about 43k stars) is the free answer for many repositories: its README says CROSS_* edges link nodes across multiple repos indexed under the same store, with HTTP route to call-site matching with confidence scoring, and gRPC, GraphQL and tRPC detection. Which Java and Angular frameworks its HTTP matching covers is not documented, so test it on Carrot's repos before promising the Angular to Quarkus link. For branches, it can write a zstd-compressed snapshot, .codebase-memory/graph.db.zst, that teammates decompress instead of re-indexing. Because that file lives in git, each branch carries its own snapshot (our reading, not a documented feature). Install: curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash, then ask Claude to index the project.\n\nSourcegraph MCP is the commercial answer where every query can name a revision; it went GA on 25 February 2026, on Enterprise plans.\n\nThe gap for their stack: the OpenAPI contract. quarkus-smallrye-openapi can store the spec at build time, openapi-generator's typescript-angular client names methods after the operationIds, so the OpenAPI file links both sides. Keep it committed, and the agent reads it.\n\nAll checked on 28 September 2026 from the READMEs."
},
{
 act:"Act 3 · Code graphs", n:"10", title:"What it buys you", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>What it does for you, and what it doesn't</div>
 <div class="body">
  <h2 style="flex:none">Fewer tokens on "who calls what".<br>Not always better answers.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:46px">−62%</span><span class="v">tokens and 88% fewer tool calls across 7 repositories; 54% fewer tokens on a Java one</span><span class="xs" style="margin-top:6px">codegraph's own benchmark</span></div>
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:46px">10×</span><span class="v">fewer tokens, with answer quality at 83% against 92% for an agent that reads files</span><span class="xs" style="margin-top:6px">codebase-memory-mcp's authors, 31 repositories</span></div>
  </div>
  <div class="card darkc" style="flex:none"><span class="k">Anthropic's own position</span><span class="v">Claude Code searches, with no embedding pipeline or central index, because search stays fresh. Anthropic also notes that "the most sophisticated teams built MCP servers exposing structured search". A code graph is exactly that.</span></div>
  <div class="foot">Measure it on your repository: the same questions with and without it, and compare tokens, tool calls and whether the answer was right.</div>
 </div>`,
 notes:"Both numbers are self-reported by the tools' own authors: say so.\n\ncodegraph ran claude -p on Opus 4.8, 7 repositories, 4 runs each, median: 62% fewer tokens, 44% cheaper, 88% fewer tool calls; on OkHttp, a Java project, 54% fewer tokens and 21% cheaper. The author also admits earlier figures were contaminated, and that a session ends with more retrieval context resident (67k against 18k tokens in one case). Fewer calls is not the same as a smaller context.\n\ncodebase-memory-mcp's authors published a preprint (arXiv 2603.27277, March 2026): 83% answer quality against 92% for a file-exploration agent, at ten times fewer tokens. Cheaper, and a bit worse.\n\nAnthropic: Boris Cherny said early Claude Code used RAG with a local vector database, and agentic search 'generally works better', for security, privacy, staleness and reliability (February 2026). Anthropic's 14 May 2026 post on large codebases says no embedding pipeline or centralized index, and notes the most sophisticated teams built MCP servers exposing structured search.\n\nThe takeaway is the week's rule again: measure it on your own code before you trust it."
},
{

 </div>`,

{
 act:"Act 4 · Knowledge bases", n:"12", title:"What a knowledge base is", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>Step 2 · what people know</div>
 <div class="body">
  <h2 style="flex:none">One place for what your product knows,<br>for people and agents alike.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">What goes in</span><span class="v">Domain rules, client specifics, decisions and why they were made, runbooks, a glossary. The things a new hire gets wrong. It can point at code, hold docs, or both.</span></div>
   <div class="card"><span class="k">What stays out</span><span class="v">What the code or the code graph already says clearly. Secrets. Anything nobody will keep up to date.</span></div>
   <div class="card"><span class="k">Where it lives</span><span class="v">In git, next to the code or in its own docs repository. Changed by pull request and reviewed, like code.</span></div>
   <div class="card darkc"><span class="k">Not the same as CLAUDE.md</span><span class="v">CLAUDE.md tells the agent how to work here. The knowledge base says what is true about the product, and people read it too.</span></div>
  </div>
 </div>`,
 notes:"Keep the distinction sharp, because they already have CLAUDE.md files. CLAUDE.md is instructions: how to run the tests, what not to touch. The knowledge base is facts about the product and the business: why a commission rule rounds the way it does, which client has which contract rule, why that migration has a strange default.\n\nAnd the difference from the code graph: a parser can build the graph from the code. Nothing can build the why from the code, because it isn't there.\n\nThe second half of the title matters: people and agents alike. A knowledge base only agents can read is a black box nobody maintains. One that people also use gets corrected when it is wrong.\n\nConnect to the holding question: the answers people gave this morning are the first entries."
},
{
 act:"Act 4 · Knowledge bases", n:"13", title:"Three worries, three answers", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>Why most knowledge bases fail</div>
 <div class="body">
  <h2 style="flex:none">Three worries, and the answer to each.</h2>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">Will people be able to read it?</span><span class="v">Plain markdown in a folder, short files, a list of contents in every folder. Every change an agent makes arrives as a diff you read.</span><span class="xs" style="margin-top:8px">Answer: a standard format</span></div>
   <div class="card"><span class="k">Will it have everything?</span><span class="v">It shouldn't try. Only what the agent can't work out from the code. Gaps stay visible: a link to a page not written yet is allowed, and agents can ask.</span><span class="xs" style="margin-top:8px">Answer: compile what exists, and show what's missing</span></div>
   <div class="card"><span class="k">Will it stay true?</span><span class="v">Every claim names its source, a person signs it off, and it carries an expiry date. Updates arrive as pull requests you validate and comment on.</span><span class="xs" style="margin-top:8px">Answer: sources, review and triggers</span></div>
  </div>
  <div class="foot">The next five slides take them in order: the format, the first version, and keeping it alive.</div>
 </div>`,
 notes:"These are the three reasons most wikis die, and the three questions people ask before they build one. Take them one at a time.\n\nReadable: a format anyone can open in an editor or on GitHub. Keep files short: Meta's tribal-knowledge files are 25 to 35 lines, and Anthropic's advice for CLAUDE.md is under 200 lines. Nobody reads a 900-line page.\n\nComplete: the research says don't try. ETH Zurich found generated repository overviews don't help; write only what the agent can't infer. What's missing should be visible, not hidden: OKF explicitly allows links to pages that don't exist yet, calling them not-yet-written knowledge.\n\nTrue: the trust comes from three things together: a source on every claim, a person in the verified field, and an expiry date. Then the maintenance question becomes: what triggers an update, and who reviews it? That's the 'keep it alive' slide."
},
{
 act:"Act 4 · Knowledge bases", n:"14", title:"OKF: the tree", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Readable · the Open Knowledge Format</div>
 <div class="body">
  <h2 style="flex:none">A folder of markdown, one idea per file.</h2>
  <div class="cols" style="grid-template-columns:.9fr 1.1fr;flex:none;align-items:center">
   <div class="card darkc" style="padding:18px 22px">
    <span class="k" style="font-size:12.5px;color:var(--amber)">kb/ · one bundle</span>
    <pre style="margin:0;font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--on-dark-soft);white-space:pre">kb/
├── <span style="color:#5db8a6">index.md</span>          what is here
├── <span style="color:#5db8a6">log.md</span>            what changed
├── domain/
│   ├── index.md
│   ├── commission-rounding.md
│   └── glossary.md
├── clients/
├── backend/
│   └── entities/order.md
├── frontend/
├── api/
├── decisions/
└── playbooks/
    └── add-flyway-migration.md</pre>
   </div>
   <div class="stack" style="gap:10px">
    <ul class="clean" style="gap:9px">
     <li style="font-size:15px"><strong>A bundle</strong> is a folder of markdown files. <strong>A concept</strong> is one file. Its ID is its path: <code>backend/entities/order</code></li>
     <li style="font-size:15px"><code>index.md</code> in any folder lists what's there, one line each. The agent reads the list before it opens a file</li>
     <li style="font-size:15px"><code>log.md</code> records changes by date, newest first</li>
     <li style="font-size:15px"><strong>The domains are yours to choose:</strong> by product area, by layer, by client. The spec only reserves the two file names</li>
     <li style="font-size:15px">Files link with plain markdown links. A link to a page not written yet is allowed</li>
    </ul>
   </div>
  </div>
  <div class="foot">OKF v0.2 · GoogleCloudPlatform/open-knowledge-format · July 2026 · Apache-2.0. The same family as AGENTS.md and SKILL.md: plain files a person and an agent both read.</div>
 </div>`,
 notes:"OKF answers 'will people be able to read it' by being boring. The spec's own line is close to: if you can cat a file you can read it.\n\nThe structure, from the spec: a bundle is a directory tree of markdown files. A concept is one file: a YAML header between --- lines, then a markdown body. The concept ID is the file's path in the bundle without .md. index.md and log.md are reserved names at any level. index.md lists each entry as a link plus its description, which is progressive disclosure: the same idea as skills showing only their names until needed. The root index.md carries okf_version: \"0.2\". log.md uses date headings, newest first.\n\nDomains: the spec deliberately doesn't define them. Folder layout is the producer's choice; references/ is a convention, nothing more. The tree on the slide is a suggestion for Carrot: domain rules and the glossary, clients, the backend and frontend, the API, decisions and playbooks.\n\nLinks are untyped; the sentence around the link says what the relationship is. Broken links must be tolerated, because they may represent knowledge not written yet. That is how gaps stay visible.\n\nStatus: v0.1 on 12 June 2026, v0.2 on 24 July 2026, no v0.3. The canonical repo is GoogleCloudPlatform/open-knowledge-format; the README calls it not an official Google product."
},
{
 act:"Act 4 · Knowledge bases", n:"15", title:"OKF: one document", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Inside one concept</div>
 <div class="body">
  <h2 style="flex:none">A small header that says where it came from,<br>who checked it, and when it goes stale.</h2>
  <div class="cols" style="grid-template-columns:1.05fr .95fr;flex:none;align-items:center">
   <div class="card darkc" style="padding:16px 20px">
    <span class="k" style="font-size:12.5px;color:var(--amber)">kb/domain/posts-wait-for-approval.md</span>
    <pre style="margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--on-dark-soft);white-space:pre">---
<span style="color:#5db8a6">type:</span> Business Rule                    <span style="color:#8a847a"># required</span>
<span style="color:#5db8a6">title:</span> Posts wait for approval
<span style="color:#5db8a6">description:</span> New posts stay pending until an admin approves.
<span style="color:#5db8a6">tags:</span> [moderation]
<span style="color:#5db8a6">sources:</span>
  - { id: kickoff, resource: meetings/2026-09-29-kickoff.md }
<span style="color:#5db8a6">generated:</span> { by: claude-code/2.1, at: 2026-09-29T10:00:00Z }
<span style="color:#5db8a6">verified:</span>  { by: human:ana, at: 2026-09-29T11:30:00Z }
<span style="color:#5db8a6">status:</span> stable
<span style="color:#5db8a6">stale_after:</span> 2027-03-29T00:00:00Z
---
# Why
The client asked for it after the spam wave.[^kickoff]
See [the approval endpoint](/api/approve-post.md).</pre>
   </div>
   <table style="font-size:13.5px">
    <tr><th>Part</th><th>What it's for</th></tr>
    <tr><td class="ok"><code>type</code></td><td>The only required field. Any value</td></tr>
    <tr><td class="ok">title · description · tags</td><td>What <code>index.md</code> and search show</td></tr>
    <tr><td class="ok"><code>sources</code></td><td>Where each claim came from; footnotes cite them</td></tr>
    <tr><td class="ok"><code>generated</code> · <code>verified</code></td><td>Who wrote it, who checked it. <code>human:</code> means a person</td></tr>
    <tr><td class="ok"><code>status</code></td><td><code>draft</code>, <code>stable</code> or <code>deprecated</code></td></tr>
    <tr><td class="ok"><code>stale_after</code></td><td>After this instant, treat it as stale</td></tr>
    <tr><td class="ok">The body</td><td>Free markdown. No required sections</td></tr>
   </table>
  </div>
  <div class="foot">Trust is read from the header, not stored: no <code>verified</code> is unverified, only agents is machine-checked, any <code>human:</code> is human-reviewed.</div>
 </div>`,
 notes:"Walk the header top to bottom; it is the whole answer to 'will it stay true'.\n\ntype is the only required key; there is no central registry of types and readers must accept ones they don't know. title, description, resource and tags are recommended; description is the line index.md reuses. sources is a list; each entry needs a resource and can have an id, a title and credibility signals such as author and last_modified. Footnotes like [^kickoff] point at a source id, so a single sentence can cite its source, and the ids survive when agents rewrite the file.\n\ngenerated says who wrote it and when the last meaningful change was. verified is a list of confirmations. The actor names follow a convention: producer/version for an agent, human:id for a person, process:id for an automated job. Producers must use human: for anything a person confirmed.\n\nstatus has three values; if it's missing, the file counts as stable. stale_after is an absolute instant, and since a change on 21 August 2026 timestamps must be full ISO datetimes with a timezone, which is why the example has them.\n\nThe body has no required sections; # Schema, # Examples and # Computation are conventions. Links should be relative to the bundle root, like /api/approve-post.md.\n\nThe footer: trust tiers are derived, not stored, and the spec calls them advisory signals, not access control.\n\nThe example is invented for the wall."
},
{
 act:"Act 4 · Knowledge bases", n:"16", title:"The first version: compile it", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Complete enough · compile, don't write</div>
 <div class="body">
  <h2 style="flex:none">Most of it already exists.<br>An agent drafts, a person verifies.</h2>
  <div class="cols c2" style="flex:none;align-items:start">
   <div class="stack" style="gap:12px">
    <span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-soft)">Where it already lives</span>
    <div class="chips"><span class="chip">merged pull requests</span><span class="chip">Jira tickets and comments</span><span class="chip">Teams threads</span><span class="chip">meeting transcripts</span><span class="chip">client documents</span><span class="chip">incident notes</span><span class="chip">the code</span></div>
    <div class="card"><span class="k">A knowledge-compiling session</span><span class="v">Thirty minutes recorded with the person who knows one area. Ask what a new hire would get wrong, and what the code doesn't say. The transcript becomes the source.</span></div>
   </div>
   <div class="card darkc" style="padding:18px 20px"><span class="k" style="font-size:12.5px;color:var(--amber)">the prompt</span><span class="v" style="font-family:var(--mono);font-size:13px;color:#fff;line-height:1.6">Read meetings/2026-09-29-moderation.md. Draft OKF concepts in kb/, one per rule or decision. Cite the transcript in sources. Set status: draft and fill generated. Add nothing the transcript does not say. List what you could not answer in kb/gaps.md.</span></div>
  </div>
  <div class="loopdiag" style="flex:none"><span class="loopstep">Sources</span><span class="loopar">→</span><span class="loopstep">An agent drafts, citing each source</span><span class="loopar">→</span><span class="loopstep" style="background:var(--primary);color:#fff">A person verifies and fixes</span><span class="loopar">→</span><span class="loopstep">Pull request · <code>log.md</code> updated</span></div>
 </div>`,
 notes:"The effort problem goes away when nobody has to write from a blank page. The agent drafts from material that already exists, and every draft cites where it came from, so the review is fast.\n\nThe audio session is the one to sell. The most valuable knowledge is in the heads of two or three people, and they will never write it down. They will talk for thirty minutes. Granola or a Teams recording gives you the transcript; the agent turns it into concepts. One area a week, and the knowledge base grows without anyone losing a day.\n\nThe prompt has four constraints worth reading aloud: one concept per file, cite the source, invent nothing, and write down what you couldn't answer. The gaps file is how 'will it have everything' gets a real answer: a list someone can work through.\n\nThis is also Karpathy's LLM wiki pattern from April 2026: raw sources stay untouched, an LLM compiles the wiki, a schema file says how. Google says OKF formalises that pattern.\n\nFor the first CLAUDE.md-style overview, /init drafts one and suggests changes rather than overwriting. But skip generated overviews of the repository: the next slide says why."
},
{
 act:"Act 4 · Knowledge bases", n:"17", title:"Quality costs", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>The trade-off</div>
 <div class="body">
  <h2 style="flex:none">The best quality is supervised, on Sonnet or above.<br>It is also the most expensive.</h2>
  <table style="flex:none;font-size:14.5px">
   <tr><th></th><th>How</th><th>Your time</th><th>Model cost</th><th>What you get</th></tr>
   <tr><td class="ok">Supervised</td><td>Sonnet or above drafts; a person reviews every concept</td><td>High</td><td>High</td><td>Knowledge you can trust</td></tr>
   <tr><td class="ok">Mixed</td><td>A cheap model extracts, a stronger one writes; people review what agents act on</td><td>Medium</td><td>Medium</td><td>A trusted core and draft edges, marked as such</td></tr>
   <tr><td class="ok">Unsupervised</td><td>Everything generated, nothing reviewed</td><td>Low</td><td>Low to medium</td><td>Fast, and sometimes wrong with confidence</td></tr>
  </table>
  <div class="cols c2" style="flex:none">
   <div class="card plain"><span class="k">What the research says</span><span class="v">Context files written by developers helped a little and beat generated ones. Files an LLM generated did not beat having none, and cost 20–23% more.</span><span class="xs" style="margin-top:6px">ETH Zurich and LogicStar, June 2026</span></div>
   <div class="card darkc"><span class="k">Test it before you trust it</span><span class="v">Take a handful of real tasks. Run them once with the knowledge base and once without, and compare the results. Claude Code can run this test for you: <code>claude plugin eval</code>. Keep what helps, and write down which trade-off each area took.</span></div>
  </div>
 </div>`,
 notes:"Be honest about both sides. Supervised with a strong model gives the best result, and it is a real time investment for the reviewers and a real cost on the model side. Across a large product that adds up.\n\nThe mixed row is where most teams land: cheap extraction, stronger writing, human review focused on what agents will act on. The point is to make the compromise visible. In OKF a draft stays status: draft with no human in verified, so people and agents can both tell trusted from untrusted.\n\nThe research: 'Evaluating AGENTS.md', ETH Zurich and LogicStar (arXiv 2602.11988, v2 June 2026). LLM-generated context files changed results by −0.5% and −2% (not significant) and cost 20 to 23% more. Developer-written files were +2.4% against none (not significant) and significantly better than generated ones. Their advice: include only instructions beyond what is already in the codebase; repository overviews don't help. Another study (Lulla et al., 2026) found AGENTS.md cut median runtime 29% and output tokens 17% at similar completion.\n\nMeasuring: claude plugin eval runs each case three times with and without the plugin and prints WITH, W/OUT and the difference; runs load no CLAUDE.md or memory, and it takes a threshold and a cost cap for CI."
},
{
 act:"Act 4 · Knowledge bases", n:"18", title:"Keep it alive", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Stays true · it updates itself, you validate</div>
 <div class="body">
  <h2 style="flex:none">Changes trigger updates. You review and comment.</h2>
  <div style="display:grid;grid-template-columns:1.05fr auto 1fr auto .95fr;gap:12px;align-items:center;flex:none">
   <div class="stack" style="gap:7px">
    <span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-soft)">When this happens</span>
    <span class="loopstep" style="font-size:13.5px">A pull request is merged</span>
    <span class="loopstep" style="font-size:13.5px">A release is tagged</span>
    <span class="loopstep" style="font-size:13.5px">A Jira ticket is done</span>
    <span class="loopstep" style="font-size:13.5px">A meeting ends with a decision</span>
    <span class="loopstep" style="font-size:13.5px">Every week: what has expired</span>
   </div>
   <span class="loopar" style="font-size:22px">→</span>
   <div class="card darkc" style="gap:8px">
    <span class="k">An agent</span>
    <span class="v">reads the change and the concepts it touches</span>
    <span class="v">drafts the edits, citing the change as a source</span>
    <span class="v">marks new files <code>status: draft</code> and updates <code>log.md</code></span>
    <span class="v">opens a pull request</span>
   </div>
   <span class="loopar" style="font-size:22px">→</span>
   <div class="stack" style="gap:7px">
    <span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-soft)">You</span>
    <span class="loopstep" style="font-size:13.5px">read the diff</span>
    <span class="loopstep" style="font-size:13.5px">comment <code>@claude</code> to fix a line</span>
    <span class="loopstep" style="background:var(--primary);color:#fff;font-size:13.5px">approve: <code>verified</code> gets your name</span>
   </div>
  </div>
  <div class="cols c3" style="flex:none;gap:14px">
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">Merges and pushes</span><span class="v" style="font-size:13.5px">A GitHub Action running the Claude Code action, on a merged pull request or a push to main</span></div>
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">Releases and schedules</span><span class="v" style="font-size:13.5px">A Claude Code routine: GitHub release events, or a schedule</span></div>
   <div class="card" style="padding:14px 18px"><span class="k" style="font-size:14.5px">Jira and meetings</span><span class="v" style="font-size:13.5px">A Jira automation calls the routine's API; a weekly routine reads new transcripts</span></div>
  </div>
 </div>`,
 notes:"This is the answer to 'who keeps it up to date': nobody by hand. Events trigger an agent, the agent proposes, a person decides. The same pattern Mintlify, GitBook and Slite ship as products; Slite's line is that nothing goes live until a person approves it.\n\nThe mechanisms, checked in the docs on 28 September:\n- Merged pull requests and pushes: a GitHub Action, on pull_request types closed with if github.event.pull_request.merged == true, running anthropics/claude-code-action@v1 with a prompt. Routines have no push event, so pushes to main go through an Action.\n- Releases and schedules: routines support GitHub Pull request and Release events, a schedule (at least an hour apart) and an API trigger. They run in Anthropic's cloud and push to claude/ branches.\n- Jira: Jira automation's Send web request can POST to the routine's /fire endpoint with its token; the text arrives marked as untrusted, and the routine's prompt must say to act on it. Or Jira calls GitHub's repository_dispatch to start an Action. Neither is documented end to end by Anthropic: test it.\n- Meetings: there is no meeting trigger. A weekly routine reads new transcripts through the Microsoft 365 or Granola connector.\n\nTwo checks run in CI whatever the trigger: a validator that fails on a missing type, and a list of every file whose stale_after has passed. The community okf-skills project ships a validator Action; it is not Google's.\n\nGuide 5 has the full Action for merged pull requests."
},
{
 act:"Act 5 · Knowledge graphs", n:"19", title:"Part 3: Knowledge graphs", time:"0:30", dark:true,
 html:`<div class="eyebrow"><span class="dot"></span>Part 3 of 4 · the context ladder</div>
 <div class="body mid">
  <h1 style="font-size:66px">Knowledge graphs.</h1>
  <p class="lead" style="color:var(--amber);font-size:23px;margin-top:10px;max-width:980px">The first two, joined: the facts behind the code and the docs, linked, and kept with time.</p>
  <div class="chips" style="margin-top:24px"><span class="chip">Code graph</span><span class="chip">Knowledge base</span><span class="chip" style="background:var(--primary);color:#fff">Knowledge graph</span><span class="chip">Software factory</span></div>
 </div>`,
 notes:"Third step: when the knowledge layer itself gets big enough that the agent has to explore it too."
},
{
 act:"Act 5 · Knowledge graphs", n:"20", title:"Three things that sound alike", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Step 3 · putting the first two together</div>
 <div class="body">
  <h2 style="flex:none">Code graph, knowledge base, knowledge graph.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th></th><th>Code graph</th><th>Knowledge base</th><th>Knowledge graph</th></tr>
   <tr><td class="ok">What goes in</td><td>Symbols, calls, imports, types</td><td>Documents: decisions, rules, how-tos, pointers to code</td><td>Entities and facts from code, docs, tickets and chats, with time and source</td></tr>
   <tr><td class="ok">How it's built</td><td>A parser. Exact, and the same every time</td><td>People write it, or an agent compiles it and people review</td><td>An LLM extracts the facts, plus metadata from your systems</td></tr>
   <tr><td class="ok">Who reads it</td><td>Agents and the IDE</td><td>People first, then agents</td><td>Agents through queries; people through views</td></tr>
   <tr><td class="ok">How it's updated</td><td>Re-index on each change</td><td>Pull requests</td><td>New facts added; old ones marked no longer true, not deleted</td></tr>
   <tr><td class="ok">Good for</td><td>"Who calls this? What breaks?"</td><td>"Why? How do we do it here?"</td><td>"Which client rule, changed by which ticket, broke which release?"</td></tr>
   <tr><td class="ok">What it costs</td><td>Little. One indexer per language</td><td>Writing and review time</td><td>Extraction tokens, gaps, a graph database to run</td></tr>
  </table>
  <div class="card darkc" style="flex:none"><span class="k">In one line</span><span class="v">A code graph is a knowledge graph of your code, built by a parser. A knowledge base is what people write down. A knowledge graph is the entities and facts behind both, linked, and kept with time.</span></div>
 </div>`,
 notes:"This slide is the join between the first two acts, and it is worth getting the words exact, because they sound alike.\n\nA code graph is code only, built by a parser: deterministic, cheap, exact. Strictly speaking it is a knowledge graph too, a knowledge graph of code, and newer ones add pull requests and issues. What makes it different is how it is built.\n\nA knowledge base can hold code references, docs, or both. It is written for people first.\n\nA knowledge graph models the things the knowledge is about, not the documents: a client, a rule, a service, a ticket, a person, and typed facts between them, each with a source and a time. Two corrections to the intuitive version. First, a knowledge base is not a prerequisite: most tools extract a knowledge graph straight from tickets, chats, pull requests and system metadata, and the knowledge base pages become sources. Second, a folder of linked pages, like OKF's links or an Obsidian vault, is already a graph, but of documents; a knowledge graph goes one level down, to the facts inside them.\n\nWhy you'd want one: the same problem as the codebase comes back. When the knowledge layer grows large, the agent has to explore it too. The graph lets it jump straight to the facts."
},
{
 act:"Act 5 · Knowledge graphs", n:"21", title:"What a knowledge graph is", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>The facts behind the code and the docs</div>
 <div class="body">
  <h2 style="flex:none">A knowledge graph links what people know<br>to the code, and remembers when.</h2>
  <div class="cols" style="grid-template-columns:1.25fr .75fr;flex:none;align-items:center">
   <div class="card plain" style="padding:16px 18px">
    <svg viewBox="0 0 640 290" style="width:100%;height:auto;display:block" role="img" aria-label="Example knowledge graph: a business rule linked to the code that implements it, the migration that stores it, the ticket that asked for it, the pull request that changed it, the incident that prompted it and the person who owns it">
     <g style="font:500 13px var(--sans)">
      <line x1="320" y1="145" x2="115" y2="45" style="stroke:var(--hairline);stroke-width:1.6"/>
      <line x1="320" y1="145" x2="525" y2="45" style="stroke:var(--hairline);stroke-width:1.6"/>
      <line x1="320" y1="145" x2="90" y2="250" style="stroke:var(--hairline);stroke-width:1.6"/>

      <rect x="10" y="232" width="160" height="40" rx="20" style="fill:var(--surface-card)"/><text x="90" y="257" text-anchor="middle" style="fill:var(--ink)">ticket · WALL-25</text>

    <div class="card"><span class="k">Facts with time</span><span class="v">When something changes, the old fact is marked no longer true, not deleted. You can ask what was true at any release.</span></div>

  <div class="foot">The shape of the question decides, not the size. If nobody owns keeping it fresh, don't build it.</div>
 </div>`,
 notes:"The drawing is an invented example on the wall. One business rule, and everything connected to it: the method that implements it, the migration that stores it, the ticket that asked for it, the pull request that changed it, the incident that prompted it, the person who owns it.\n\nAn agent fixing a moderation bug can start from any of those and reach the rest in one or two hops, instead of reading its way there. KGCompass, a research tool linking issues and pull requests to code, reported that 89.7% of the bugs it located were found only through that kind of multi-hop step (self-reported, March 2025).\n\nTime matters because facts change. Graphiti (Zep, Apache-2.0) is bi-temporal: it records when a fact was true and when it was learned, and a contradicted fact is invalidated, not deleted. Every fact traces back to the raw episode it came from.\n\nWhen to build one: the questions are relational, multi-hop or temporal. When not: the corpus fits in context, grep or the LSP can navigate it, questions are single-hop, or nobody owns freshness. Independent studies are cautious: plain retrieval wins on detailed single-hop questions, and graph approaches often underperform it on many real-world tasks (GraphRAG-Bench, 2026).\n\nThe linking key is simple: OKF's resource field on a concept can hold the same identifier as a node in the code graph."
},

 act:"Act 6 · Software factories", n:"22", title:"Part 4: Software factories", time:"0:30", dark:true,

  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;flex:none">
   <div class="card" style="padding:14px 16px"><span class="k" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)">Day 1</span><span class="v" style="font-size:13.5px">Explaining the repo every time became <strong>CLAUDE.md</strong></span></div>

 </div>`,
 notes:"Start from yesterday's logs: people ran two changes at once and one change that sliced itself. Ask what stopped them running five. The answers will be three: their own attention, their laptop, and the time the agent spent loading context.\n\nThe graph drives itself now, but a person still starts every run, and every run lives on one machine. The morning's three acts dealt with the context. The factory deals with the other two: the work is started by the company's own flows, and it runs somewhere that grows with the load.\n\nThe line to leave on the screen: parallel agents scale a developer; a factory scales the company. Same agents, started by company events, on shared machines, visible to anyone."
