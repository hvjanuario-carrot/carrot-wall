text-anchor="middle" style="fill:var(--ink)">execute ↺</text><line x1="658" y1="41" x2="676" y2="41" style="stroke:var(--primary);stroke-width:1.6;fill:none" marker-end="url(#ah11b)"/><rect x="679" y="24" width="90" height="34" rx="17" style="fill:var(--surface-card)"/><text x="724" y="46" text-anchor="middle" style="fill:var(--ink)">review</text><line x1="771" y1="41" x2="789" y2="41" style="stroke:var(--primary);stroke-width:1.6;fill:none" marker-end="url(#ah11b)"/><rect x="792" y="24" width="80" height="34" rx="17" style="fill:var(--surface-card)"/><text x="832" y="46" text-anchor="middle" style="fill:var(--ink)">ship</text><line x1="874" y1="41" x2="892" y2="41" style="stroke:var(--primary);stroke-width:1.6;fill:none" marker-end="url(#ah11b)"/><rect x="895" y="24" width="100" height="34" rx="17" style="fill:var(--primary)"/><text x="945" y="46" text-anchor="middle" style="fill:#fff">you merge</text><text x="45" y="76" text-anchor="middle" style="fill:var(--muted);font-size:11px">confirm or override</text><text x="601" y="76" text-anchor="middle" style="fill:var(--muted);font-size:11px">slices in worktrees</text><text x="724" y="76" text-anchor="middle" style="fill:var(--muted);font-size:11px">fresh eyes</text></g></svg>
  </div>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">A loop · one step, repeated</span><span class="v">One worker and one check, round again until it passes. <code>/execute</code> until green, or a <code>/goal</code>.</span></div>
   <div class="card"><span class="k">A graph · the map</span><span class="v">The steps, the rules between them, what runs at once, and where a person signs. Your Tier 3 already is one.</span></div>
   <div class="card"><span class="k">The driver · who follows the arrows</span><span class="v">Last week, you, one command at a time. From today, the graph, stopping only at your gates.</span></div>
  </div>
 </div>`,
 notes:"Start with the honest point: their Tier 3 loop is already a graph. It has separate steps, a file passed from each step to the next, a check inside execute, and people signing at the gates. So the difference we care about today is not the shape. It is who follows the arrows.\n\nTop row: last week. Every arrow has a 'you' on it, because nothing moves until you type the next command. Bottom row: the same map. It asks your Day 2 questions and proposes a tier, you confirm or override, and from then on it moves by itself. It splits the build into slices in their own worktrees, reviews them with fresh eyes, and stops at two places: the signed spec and the merge.\n\nThe three words at the bottom are all the vocabulary they need. A loop is one step that repeats until a check passes; it lives inside the graph, in execute. A graph is the map. The driver is who follows it.\n\nIf someone wants the formal words: steps are nodes, arrows are edges, and the files that travel between them are state. In Anthropic's 'Building effective agents' (December 2024), Tier 3 is prompt chaining with gates, with routing in front of it: two of their workflow patterns, run by hand."
},
{
 act:"Act 5 · Graphs", n:"11", title:"What a graph adds to a loop", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Loop or graph</div>
 <div class="body">
  <h2 style="flex:none">What a graph adds, and what it costs.</h2>
  <table style="flex:none;font-size:14.5px">
   <tr><th></th><th>Your loop, by hand</th><th>The graph, driving itself</th></tr>
   <tr><td class="ok">Who drives</td><td>You, typing each command</td><td>The graph follows the arrows and stops at your gates</td></tr>
   <tr><td class="ok">Picking the path</td><td>You pick the tier and walk it</td><td>It proposes the tier from your Day 2 questions; you confirm or override</td></tr>
   <tr><td class="ok">Speed</td><td>One slice at a time, unless you open more sessions yourself</td><td>Slices that don't depend on each other run at once</td></tr>
   <tr><td class="ok">When something fails</td><td>You spot it and decide what to redo</td><td>Only the failing slice goes back, with the reviewer's notes, up to a limit</td></tr>
   <tr><td class="ok">Checking</td><td>Review runs when you remember to call it</td><td>Reviewers run every time, before anything reaches you</td></tr>
   <tr><td class="ok">Cost</td><td>Nothing to set up</td><td>A script to write and keep up to date, and more of your plan per run</td></tr>
  </table>
  <div class="cols c2" style="flex:none">
   <div class="card darkc"><span class="k">Keep driving by hand when</span><span class="v">It is one job with one clear check, or the process is still new to you. Anthropic's advice: "find the simplest solution possible, and only increase complexity when needed."</span></div>
   <div class="card"><span class="k">Let the graph drive when</span><span class="v">Your steps are boring and reliable, the work splits into pieces, and you want the checking done by someone other than the worker.</span></div>
  </div>
 </div>`,
 notes:"This is the 'is it better' slide, and the honest answer is: better for some work, worse for other work.\n\nWhat does not change: both already pin a model and a contract for each step. That was Day 2. The difference is who moves between the steps, and what happens between them.\n\nGo row by row with this afternoon's example. Who drives: two signatures instead of typing every command. Picking the path: it proposes the tier with their own Day 2 questions, they confirm. Speed: slices that share nothing run at once. Failure: the web slice fails review and only the web slice goes back, with the notes, up to a limit. Checking: review runs every time, not when someone remembers. Cost: someone writes and maintains the script, and every run uses more of the plan.\n\nThe dark card is the brake, and its second half matters as much as the first: while the process is still new, drive it by hand. The quote is from Anthropic's 'Building effective agents', 19 December 2024.\n\nAsk the room: think of the last ticket that took you a full day. Which row would have helped?"
},
{
 act:"Act 5 · Graphs", n:"12", title:"Six ways to change your loop", time:"8:00",
 html:`<div class="eyebrow"><span class="dot"></span>Fit the loop to the job, then scale it</div>
 <div class="body">
  <h2 style="flex:none">Six changes, one at a time.</h2>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">1 · Let it pick the tier</span><span class="v">A first step asks your Day 2 questions of the ticket and proposes Tier 1, 2 or 3 with its reasons. You confirm or override. Unsure means the higher tier.</span></div>
   <div class="card"><span class="k">2 · Split into slices</span><span class="v">One worker per slice, each in its own worktree, all at once. Only for slices that touch different files and don't wait on each other.</span></div>
   <div class="card"><span class="k">3 · Review from several angles</span><span class="v">Two or three reviewers read the same change at once: correctness, security, the Angular side. One step merges what they found and drops duplicates.</span></div>
   <div class="card"><span class="k">4 · Retry only what failed</span><span class="v">A failed review sends that one slice back with the reviewer's notes. It stops after two rounds that make no progress.</span></div>
   <div class="card"><span class="k">5 · Put a person at the gates</span><span class="v">The flow stops where a mistake is expensive: the signed spec and the merge. Everything in between runs on its own.</span></div>
   <div class="card"><span class="k">6 · A model for each new step</span><span class="v">Your commands already pin theirs. Give the new steps one too: Haiku to pick the tier, Opus or the advisor to review.</span></div>
  </div>
  <div class="foot">1 fits the loop to the job. 2, 3 and 4 scale it. 5 and 6 keep it under control.</div>
 </div>`,
 notes:"This is how you change the loop for the job and then scale it. Each change fixes one specific pain, so add them one at a time and only where the loop hurts.\n\n1, pick the tier, is the change for specifics: different kinds of work take different paths, and the rules for choosing are the Sized Loop questions they already wrote on Day 2. The step only proposes; the person confirms or overrides. Two rules: when unsure, pick the higher tier, because calling a Tier 3 task Tier 1 skips the spec, the most expensive mistake it can make. And a Tier 1 answer means do it on the spot: a one-line change should not pay for a graph.\n\n2 to 4 are how it scales. 2 runs independent pieces at once. The rule for independent is GitHub Spec Kit's rule for its parallel marker: different files, and no dependency on unfinished work. 3 has several reviewers look at the same change from different angles, and a merge step reconciles them. 4 is Day 2's loop applied to one piece instead of the whole run; the stop rule matters more than the retry.\n\n5 and 6 keep it under control. Gate where a mistake is expensive; gate everything and the graph is slower than doing it yourself. 6: their commands already pin a model each, from Day 2. The graph adds new steps, the tier picker and the reviewers, and each of those needs one too.\n\nThe names come from Anthropic's 'Building effective agents' (19 December 2024): routing (1), parallelization by sectioning (2) and by voting (3), evaluator-optimizer (4), prompt chaining with gates (5). Their fifth pattern, orchestrator-workers, is what /plan does when it decides the slices at run time.\n\nAsk the room: which one would you add to your loop first?"
},
{
 act:"Act 5 · Graphs", n:"13", title:"In Claude Code, a graph is a workflow", time:"8:00",
 html:`<div class="eyebrow"><span class="dot"></span>Graphs on your machine · one workflow, line by line</div>
 <div class="body">
  <h2 style="flex:none">In Claude Code, a graph is a workflow.</h2>
  <div class="cols" style="grid-template-columns:1.05fr .95fr;flex:none;align-items:center">
   <div class="card darkc" style="padding:18px 20px">
    <span class="k" style="font-size:12.5px;color:var(--amber)">.claude/workflows/build-slices.js</span>
    <pre style="margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.65;color:var(--on-dark);white-space:pre"><span style="color:#5db8a6">export const</span> meta = {                           <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">1</span>
  name: <span style="color:var(--amber)">'build-slices'</span>,
  description: <span style="color:var(--amber)">'Build each slice, then review it'</span>,
}

<span style="color:#5db8a6">const</span> done = <span style="color:#5db8a6">await</span> pipeline(args.slices,        <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">2</span>
  (slice) =&gt; agent(                             <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">3</span>
    <span style="color:var(--amber)">&#96;Implement \${slice} from its plan.</span>
     <span style="color:var(--amber)">Run the tests. Return the evidence.&#96;</span>,
    { isolation: <span style="color:var(--amber)">'worktree'</span>, model: <span style="color:var(--amber)">'sonnet'</span>,
      schema: EVIDENCE }),                      <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">4</span>
  (built, slice) =&gt; agent(                      <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">5</span>
    <span style="color:var(--amber)">&#96;Review \${slice} with fresh eyes.</span>
     <span style="color:var(--amber)">Try to fail it: \${JSON.stringify(built)}&#96;</span>,
    { model: <span style="color:var(--amber)">'opus'</span>, schema: VERDICT }))

<span style="color:#5db8a6">return</span> done.filter(Boolean)                     <span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">6</span></pre>
   </div>
   <div class="stack" style="gap:11px">
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">1</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">meta.</strong> Its name and one line on what it does. Saved in <code>.claude/workflows/</code>, it runs as <code>/build-slices</code>.</div></div>
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">2</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">pipeline(list, steps).</strong> Takes the slices you pass in and sends each one through the steps below, without waiting for the other slices.</div></div>
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">3</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">agent(prompt, options).</strong> Starts one subagent with that prompt. <code>isolation: 'worktree'</code> gives it its own checkout; <code>model</code> says who does the work.</div></div>
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">4</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">schema.</strong> It must answer with data in a fixed shape: files changed, tests run, evidence. That answer is what travels to the next step.</div></div>
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">5</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">The second step.</strong> Gets the builder's answer and the slice name. A different model tries to fail it, with fresh eyes.</div></div>
    <div style="display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start"><span style="display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--primary);color:#fff;font:600 10.5px var(--sans);vertical-align:1px">6</span><div style="font-size:15px;line-height:1.5;color:var(--body)"><strong style="color:var(--ink)">return.</strong> The only thing that comes back to your session. Everything in between stays out of your context.</div></div>
   </div>
  </div>
  <div class="foot">You do not write this by hand. Ask "use a workflow to…", read it with View raw script before it runs, watch it in <code>/workflows</code>, and press <code>s</code> to keep it.</div>
 </div>`,
 notes:"Read it top to bottom with them, one number at a time. It is plain JavaScript, and Claude writes it; what they need is to be able to read it before they approve a run.\n\nThe docs' own line: a workflow moves the plan into code. With subagents, Claude decides turn by turn what runs next. With a workflow, the script decides, and Claude's context only holds the final answer.\n\nHow the six changes from the last slide show up in a script: the tier is a first agent with a schema and a plain if; the split is pipeline() with isolation: 'worktree'; several angles are reviewers in parallel() and one agent to merge; a retry is a for loop with a round cap; a gate is the end of a workflow, where it asks and a yes starts the next one; a model per step is model: on each agent().\n\nFacts to have ready: all paid plans (Pro turns it on in /config); up to 16 agents at once by default, fewer on fewer CPUs; at most 1,000 agents per run; resumable within the session; /workflow-authoring loads the full script reference; /deep-research is the built-in example. The Large workflow warning appears past 25 agents or 1.5M projected tokens. Run it on one slice first.\n\nThey have seen one before: the Day 1 starter harness shipped workflows/spec.js.\n\nSource: code.claude.com/docs/en/workflows."
},
{
 act:"Act 5 · Graphs", n:"14", title:"One ticket, start to finish", time:"8:00",
 html:`<div class="eyebrow"><span class="dot"></span>Where to use it · one ticket, start to finish</div>
 <div class="body">
  <h2 style="flex:none">You type <code style="font-size:.8em">/ticket 123</code>.<br>After that, you only answer.</h2>
  <table style="flex:none;font-size:16px">
   <tr><th style="width:56%">What it does</th><th>What you do</th></tr>
   <tr><td>Reads the ticket and asks your Day 2 questions. "Tier 3: it touches the API and the web app, and someone will review it cold."</td><td>Say yes, or "make it Tier 2".</td></tr>
   <tr><td>Writes the intent and the spec, has two reviewers read the spec, and shows you five lines and two open questions.</td><td>Answer the two questions. <strong>Sign the spec.</strong></td></tr>
   <tr><td>Plans the slices, builds each one in its own worktree, reviews each with fresh eyes, and sends back what fails.</td><td>Nothing. Review a colleague's pull request, or get a coffee.</td></tr>
   <tr><td>Shows each slice's verdict in five lines and says it is ready.</td><td>Type <code>/ship</code>. <strong>Merge</strong> when you are happy.</td></tr>
  </table>
  <p class="sm" style="flex:none;margin-top:4px">A Tier 1 ticket ends after the first row: it just makes the change. A Tier 2 ticket stops once, at the plan.</p>
  <div class="foot">Only for a process you already trust. While you are still learning it, drive it by hand.</div>
 </div>`,
 notes:"Tell it as a story: this is what a Tier 3 ticket looks like when the graph drives. Read the left column as 'it', the right as 'you'. The right column is short on purpose.\n\nHow it asks: a single workflow takes no input once it starts ('for sign-off between stages, run each stage as its own workflow', in the docs). So each stage is its own workflow. When one ends, the session shows what it produced and asks, and a yes starts the next one straight away. /ship keeps disable-model-invocation from Day 2, so the last step stays a human one.\n\nThe five lines matter. A gate that shows a whole spec after twenty unwatched minutes turns into a click. Five lines and the open questions keep it a decision.\n\nThe same shape pays off elsewhere: reviewers from several angles on every pull request, an upgrade with one worker per module where only failures retry, and a feature across both apps with the contract first. Guide 4's stretch has a starting /ticket skill.\n\nThe footer is the rule for all of it. The forks from the gap week will show whose commands are ready."
},
/* ============ ACT 6 ============ */
{
 act:"Act 6 · Parallel work", n:"15", title:"Scale when the work splits", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Why scale, and when not to</div>
 <div class="body">
  <h2 style="flex:none">Scale when the work splits.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">What Anthropic measured</span><span class="v">A lead agent with parallel subagents beat a single agent by 90.2% on their internal research eval. It used about 15 times the tokens of a chat.</span><span class="v" style="font-size:12.5px;color:var(--muted)">Anthropic's own numbers, June 2025</span></div>
   <div class="card darkc"><span class="k">The line to remember</span><span class="v" style="font-family:var(--serif);font-size:22px;letter-spacing:-.3px;color:#fff">"Most coding tasks involve fewer truly parallelizable tasks than research."</span></div>
  </div>
  <div class="cols c2" style="flex:none">
   <div class="card plain"><span class="k">Parallel pays when</span><span class="v">Slices are independent · the work is mostly reading: reviews, audits, research · you want several angles on one plan.</span></div>
   <div class="card plain"><span class="k">It costs more than it gives when</span><span class="v">Agents edit the same files · each step waits on the last · there is one hard bug everyone would chase.</span></div>
  </div>
  <div class="foot">Start with one agent done well. Add a second when the work splits on its own.</div>
 </div>`,
 notes:"Open the scaling day with the brake, not the accelerator. The 90% is real and self-reported, and it came with a 15x token bill on research, which is the best case for parallel work.\n\nThe quote is from the same post: coding has fewer truly parallel pieces than research. That sentence protects them from the most expensive mistake of the week.\n\nSource: anthropic.com/engineering/multi-agent-research-system.\n\nIf you want one story to go with it: Anthropic\'s C compiler (February 2026). 16 agents, about 2,000 sessions, about $20,000 in API costs, a 100,000-line Rust compiler that builds Linux 6.9, all self-reported. Coordination was plain git and a lock file per task. It stalled when every agent hit the same kernel bug, and recovered once the work was split so each agent had a different failure to fix. Source: anthropic.com/engineering/building-c-compiler."
},
{
 act:"Act 6 · Parallel work", n:"16", title:"What a git worktree is", time:"4:00",
 html:`<div class="eyebrow"><span class="dot"></span>A refresher · git worktree</div>
 <div class="body">
  <h2 style="flex:none">One repository. Several folders.<br>Each on its own branch.</h2>
  <div class="cols c2w" style="flex:none;align-items:center">
   <div class="card darkc" style="padding:20px 22px">
    <span class="k" style="font-size:12.5px;color:var(--amber)">on disk</span>
    <pre style="margin:0;font-family:var(--mono);font-size:14px;line-height:1.8;color:var(--on-dark-soft);white-space:pre">carrot-wall/            <span style="color:var(--amber)">← master, where you work</span>
├── .git/               <span style="color:var(--amber)">← one history, shared</span>
└── .claude/worktrees/
    ├── change-a/       <span style="color:var(--amber)">← branch worktree-change-a</span>
    └── change-b/       <span style="color:var(--amber)">← branch worktree-change-b</span></pre>
   </div>
   <div class="stack" style="gap:12px">
    <div class="card"><span class="k">Not a clone</span><span class="v">One history and one set of objects. A commit in one folder is visible from the others straight away, with nothing to push between them.</span></div>
    <div class="card"><span class="k">Not a branch switch</span><span class="v">Both folders exist at the same time, so two agents can edit at once without touching each other's files.</span></div>
    <div class="card plain" style="font-family:var(--mono);font-size:13.5px;line-height:1.75;padding:16px 20px">git worktree add ../wall-b -b feature-b<br>git worktree list<br>git worktree remove ../wall-b</div>
   </div>
  </div>
  <div class="foot">Git lets a branch be checked out in only one worktree at a time. That rule is what keeps two agents off the same branch.</div>
 </div>`,
 notes:"Two minutes. Most of them use branches every day; fewer have used worktrees.\n\nThe picture to leave them with: one .git, several working folders, each on its own branch. A branch switch changes the files in your one folder; a worktree gives you a second folder, so both versions exist at once.\n\nTwo consequences worth saying. A commit made in one worktree can be used from another straight away, because the history is shared: that is how change B rebases on change A in Guide 4 without pushing anything. And if git ever says a branch is 'already checked out', that is the one-worktree-per-branch rule doing its job.\n\nThe commands on the card are plain git. Claude Code's own shortcut is on the next slide."
},
{
 act:"Act 6 · Parallel work", n:"17", title:"One checkout per agent", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Parallel worktrees</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>One checkout<br>per agent.</h2>
    <p class="lead">Same repository, separate folders and branches. No agent edits a file another agent has open.</p>
    <ul class="clean">
     <li><strong>Shared:</strong> the git history and objects</li>
     <li><strong>Not shared:</strong> <code>node_modules</code>, build output, the database file in the folder, running servers</li>
     <li><strong>Or just ask:</strong> "work in a worktree", and Claude creates one itself. "Use worktrees for your agents" does it for subagents</li>
    </ul>
   </div>
   <div class="card darkc" style="font-family:var(--mono);font-size:14px;line-height:1.8;align-self:center">
    <span class="k" style="font-family:var(--sans);font-size:12.5px;color:var(--amber)">one command</span>
    <div style="color:var(--on-dark-soft)">
     $ claude -w slice-02<br>
     &nbsp;&nbsp;→ .claude/worktrees/slice-02/<br>
     &nbsp;&nbsp;→ branch worktree-slice-02<br><br>
     # .worktreeinclude<br>
     # gitignored files to copy into each new worktree<br>
     .env.local
    </div>
   </div>
  </div>
  <div class="foot"><code>.worktreeinclude</code> copies only files that match and are gitignored, so tracked files are never duplicated.</div>
 </div>`,
 notes:"Do it live: claude -w slice-02, then ls .claude/worktrees and git worktree list.\n\nThe third bullet is native: asked to work in a worktree, Claude creates one with its EnterWorktree tool; asked to use worktrees for its agents, it gives each subagent its own. Both are in the worktrees docs. Moving to a path outside .claude/worktrees/ asks for approval first.\n\nThe 'not shared' line is the setup for the laptop slides coming up. Everything in that line is something two worktrees will fight over or duplicate.\n\nOn the wall: the H2 database lives in apps/api/data, which is gitignored, so each worktree gets its own database. That is good for isolation and means a new worktree starts empty.\n\nTwo things from the worktrees docs to say out loud: add .claude/worktrees/ to .gitignore, and a new worktree branches from the default branch on the remote, not from where you are. worktree.baseRef set to head changes that.\n\nA subagent can get the same thing with isolation: worktree in its frontmatter: a fresh checkout, removed when it finishes without changes."
},
{
 act:"Act 6 · Parallel work", n:"18", title:"Start it, leave it, come back", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Background sessions</div>
 <div class="body">
  <h2 style="flex:none">Start it, leave it, come back.</h2>
  <div class="cols c2" style="flex:none">
   <div class="stack" style="gap:12px">
    <div class="card darkc" style="font-family:var(--mono);font-size:14px;line-height:1.8">
     <span class="k" style="font-family:var(--sans);font-size:12.5px;color:var(--amber)">from your shell</span>
     <div style="color:var(--on-dark-soft)">$ claude --bg "implement slice 06, upvotes"<br>$ claude --bg "implement slice 08, TV mode"<br>$ claude agents</div>
    </div>
    <p class="sm">Inside a session, <code>/bg</code> sends it to the background. Each background session moves into its own worktree before it edits anything.</p>
   </div>
   <table style="font-size:14.5px">
    <tr><th>In agent view</th><th>Means</th></tr>
    <tr><td class="ok">Working</td><td>Running tools or writing</td></tr>
    <tr><td class="ok">Needs input</td><td>Waiting on your answer or a permission</td></tr>
    <tr><td class="ok">Idle</td><td>Ready for your next prompt</td></tr>
    <tr><td class="ok">Completed · Failed · Stopped</td><td>Done, broke, or you stopped it</td></tr>
   </table>
  </div>
  <div class="foot">Leaving a background session never stops it. Each one spends your quota on its own. Agent view is a research preview.</div>
 </div>`,
 notes:"Demo: start two background sessions from the shell, open claude agents, attach to one with Enter, leave with the left arrow. The point to feel: you step in only when a row turns yellow.\n\nWorth saying: this is the setup most people mean when they say 'I run four agents'. It is sessions you steer, not a system that steers itself.\n\nSource: code.claude.com/docs/en/agent-view."
},
{
 act:"Act 6 · Parallel work", n:"19", title:"What breaks first", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Keep the laptop alive</div>
 <div class="body">
  <h2 style="flex:none">Two worktrees of the wall.<br>Four things they fight over.</h2>
  <div class="cols c2" style="flex:none;gap:16px">
   <div class="card"><span class="k">Ports</span><span class="v">The second <code>docker compose up</code> fails: 8010 is already taken.</span><span class="xs" style="margin-top:2px">Also: the dev servers on 8080 and 4200, the proxy aimed at the first API, the test port 8081, the debugger on 5005.</span></div>
   <div class="card"><span class="k">Servers you reuse</span><span class="v">The second e2e run finds a server on 4200, tests the other worktree's app, and passes.</span><span class="xs" style="margin-top:2px">Also: the wall's <code>/cleanup-worktree</code> kills whatever is on 8080 and 4200, master's servers included.</span></div>
   <div class="card"><span class="k">Disk</span><span class="v">Five worktrees hold about 1.5 GB of <code>node_modules</code> before anyone builds.</span><span class="xs" style="margin-top:2px">Also: build output in every folder, Docker volumes, worktrees nobody removed.</span></div>
   <div class="card"><span class="k">CPU and memory</span><span class="v">Five Quarkus dev servers and five Angular builds at once, plus a workflow's agents.</span><span class="xs" style="margin-top:2px">Also: containers with no limits, two Maven builds writing to one <code>~/.m2</code>.</span></div>
  </div>
  <div class="foot">The worst one passes: green tests, run against someone else's branch.</div>
 </div>`,
 notes:"One real case per kind, from the wall's own repo, checked on 25 September. Open the files live if there is time: docker-compose.yml, proxy.conf.json, playwright.config.ts.\n\nSpend the time on the servers card. reuseExistingServer is a sensible default for one checkout. With two, the second run finds a server on 4200, reuses it, and tests code from the other branch. Nothing fails, which is why nobody notices.\n\nThe details behind the 'also' lines: Quarkus runs @QuarkusTest on 8081 by default, and quarkus.http.test-port=0 gives each run a free port. Quarkus dev mode listens for a debugger on 5005; -Ddebug=<port> moves it and -Ddebug=false turns it off. The wall's /cleanup-worktree was written when there was one worktree at a time: a harness file that was right for one agent and wrong for five. Maven's docs warn about two builds writing to one local repository.\n\nThe next two slides are the fixes: ports first, then disk and CPU."
},
{
 act:"Act 6 · Parallel work", n:"20", title:"One block of ports per worktree", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Ports</div>
 <div class="body">
  <h2 style="flex:none">One block of ports per worktree.</h2>
  <div class="cols c2n" style="flex:none">
   <div class="stack" style="gap:10px">
    <table style="font-size:15px">
     <tr><th>Slot</th><th>API</th><th>Web</th></tr>
     <tr><td class="ok">master</td><td class="mono">8080</td><td class="mono">4200</td></tr>
     <tr><td class="ok">1</td><td class="mono">8090</td><td class="mono">4210</td></tr>
     <tr><td class="ok">2</td><td class="mono">8100</td><td class="mono">4220</td></tr>
     <tr><td class="ok">3</td><td class="mono">8110</td><td class="mono">4230</td></tr>
    </table>
    <p class="xs">Plus 10 per slot. Tests use a random free port.</p>
   </div>
   <div class="card">
    <span class="k">Four changes to the wall</span>
    <ol class="steps" style="gap:8px;margin-top:6px">
     <li style="font-size:15px"><code>docker-compose.yml</code>: <code>"\${API_PORT:-8010}:8080"</code>, and the same for web</li>
     <li style="font-size:15px">Quarkus reads <code>QUARKUS_HTTP_PORT</code>; tests set <code>quarkus.http.test-port=0</code>; dev mode gets its own <code>-Ddebug</code> port</li>
     <li style="font-size:15px"><code>proxy.conf.json</code> becomes <code>proxy.conf.js</code> and reads the API port from the environment; <code>ng serve --port</code></li>
     <li style="font-size:15px">Playwright takes its ports from the environment, with <code>reuseExistingServer</code> off</li>
    </ol>
   </div>
  </div>
  <div class="foot">Compose keeps each worktree's containers apart by project name: <code>-p</code> or <code>COMPOSE_PROJECT_NAME</code>. Guide 4 has two short scripts that set a worktree's ports and tear it down.</div>
 </div>`,
 notes:"The rule is boring on purpose: a fixed slot per worktree, plus ten. Random ports are fine for tests and bad for humans who need to open the app.\n\nTools that do this for you, if someone asks: Conductor gives each workspace a range of 10 ports; worktrunk derives a stable port from the branch name; Vercel's portless serves branch.app.localhost. The built-ins plus these four changes are enough for the wall.\n\nDocker's docs: Compose isolates environments by project name, and name each project for its branch."
},
{
 act:"Act 6 · Parallel work", n:"21", title:"Disk and CPU", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Disk and CPU</div>
 <div class="body">
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">Disk</span>
    <ul class="clean" style="gap:7px;margin-top:4px">
     <li style="font-size:15px">Each worktree is a full checkout plus its own <code>node_modules</code></li>
     <li style="font-size:15px">pnpm hard-links packages from one store per disk; npm keeps one shared cache that only grows</li>
     <li style="font-size:15px">Maven's <code>~/.m2</code> is shared by every worktree; two builds writing to it at once is the case Maven's docs warn about</li>
     <li style="font-size:15px">Clean up with <code>git worktree list</code>, <code>remove</code> and <code>prune</code>. Claude clears its own old worktrees after <code>cleanupPeriodDays</code></li>
    </ul>
   </div>
   <div class="card"><span class="k">CPU and memory</span>
    <ul class="clean" style="gap:7px;margin-top:4px">
     <li style="font-size:15px">Containers have no limits unless you set them: <code>--cpus</code>, <code>-m</code>, Compose <code>deploy.resources.limits</code>, the Docker Desktop cap</li>
     <li style="font-size:15px">Workflows run up to 16 agents at once, fewer on fewer CPUs; <code>CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS</code> changes it</li>
     <li style="font-size:15px">Start with 3 to 5 agents. Coinbase runs three or four per engineer</li>
    </ul>
   </div>
  </div>
  <div class="card darkc" style="flex:none"><span class="k">The wall's own repo, right now</span><span class="v"><code>git worktree list</code> shows <code>carrot-wall-slice-08</code> as prunable: left over from recording Monday's video. The folder is gone and git still remembers it. <code>git worktree prune</code> fixes that.</span></div>
 </div>`,
 notes:"The dark card is true on the instructor machine as of 25 September. Run git worktree list live; if it is already pruned, say what it showed.\n\nNo primary source gives a number of agents per laptop. The docs' agent-teams advice (3 to 5) and Coinbase's report (three or four per engineer, self-reported) are the best guides.\n\nMaven's resolver documentation: shared access to a local repository needs coordination. Check the Maven version on their machines if parallel builds misbehave."
},
{
 act:"Act 6 · Parallel work", n:"22", title:"Parallel starts in the plan", time:"5:00",
 html:`<div class="eyebrow"><span class="dot"></span>Why those slices could run together</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Parallel starts<br>in the plan.</h2>
    <p class="lead">The dependency column decides what can run at once.</p>
    <ul class="clean">
     <li>01 first: everything reads the wall</li>
     <li>Then 02, 03, 06 and 08 together</li>
     <li>04, 05 and 07 wait for 03, the admin gate</li>
    </ul>
    <p class="sm">A new worktree starts from master. A slice that needs another slice's work branches from it: <code>worktree.baseRef: "head"</code>, or <code>git worktree add</code> from that branch.</p>
   </div>
   <figure>
    <img src="04b-intent-work-output.png" alt="Eight intents with a dependency table">
    <figcaption>04b · eight intents and what each one depends on</figcaption>
   </figure>
  </div>
  <div class="foot">A plan that never says what depends on what can't be split safely.</div>
 </div>`,
 notes:"Claude wrote this table when it split the wall's spec into intents. Point at the Depends on column. This is the whole trick: the spec was cut into slices on purpose so that some of them share nothing.\n\nNote from the screenshot itself: the admin gate got its own slice because three later slices need it. That decision is what made 04, 05 and 07 wait, and made everything else free to run in parallel.\n\nThis is also the answer to 'how do I parallelize my ticket': you don't, until the plan tells you which parts are independent."
},
{
 act:"Act 6 · Parallel work", n:"23", title:"Sessions that message each other", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Agents that talk to each other · 1</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Your sessions can<br>message each other.</h2>
    <p class="lead">When one worktree lands something another needs, Claude tells that session.</p>
    <div class="card darkc" style="padding:14px 18px"><span class="v" style="font-family:var(--mono);font-size:14px;color:#fff">Let @change-b know change A is committed. Rebase on it before you ship.</span></div>
    <ul class="clean">
     <li><code>/list-agents</code> shows which sessions it can reach</li>
     <li>"Tell me when the migration session is done" gets you one notice when it goes idle</li>
    </ul>
   </div>
   <div class="stack" style="gap:12px">
    <div class="card"><span class="k">What a message is</span><span class="v">Plain text Claude writes. Never the other session's history or files. On the same machine it travels over a local socket, not through Anthropic.</span></div>
    <div class="card"><span class="k">What it can't do</span><span class="v">Approve a permission prompt, change settings or CLAUDE.md, or run a command. The receiving session's own rules still apply.</span></div>
    <p class="xs">On by default from v2.1.224. <code>crossSessionInbound</code> sets accept, hold or refuse.</p>
   </div>
  </div>
  <div class="foot">A session inside a container can't reach sessions on the host.</div>
 </div>`,
 notes:"This is the piece that makes parallel worktrees a team instead of two strangers. The docs list 'coordinate parallel worktrees' as a main use.\n\nDemo: two sessions, rename one with /rename change-b, then from the other type the prompt on the slide. It is exactly the moment from the first half of the challenge: one change lands and the other has to rebase on it. Inside a graph, the same move is the API slice telling the web slice the contract is live. Show the one-line preview arriving.\n\nThe safety card is worth a minute: a message is treated as coming from another session, not from you, so it can't approve anything. That is Day 3's permission lesson, applied between agents.\n\nSource: code.claude.com/docs/en/cross-session-messaging."
},
{
 act:"Act 6 · Parallel work", n:"24", title:"Agent teams", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>Agents that talk to each other · 2</div>
 <div class="body">
  <h2 style="flex:none">A lead, teammates, one task list.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">How it works</span><span class="v">One session leads. Each teammate has its own context window, messages the others, and claims tasks from a shared list. A task waits until the tasks it depends on are done. Hooks like <code>TaskCompleted</code> can keep a teammate working until a check passes.</span></div>
   <div class="card darkc"><span class="k">What to know first</span><span class="v">Experimental and off by default: <code>CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</code>. Teammates share one checkout, so give each a different set of files or they overwrite each other. About 7 times the tokens when teammates plan. Start with 3 to 5.</span></div>
  </div>
  <div class="cols c2" style="flex:none">
   <div class="card plain"><span class="k">Messaging</span><span class="v">For sessions you start and steer yourself.</span></div>
   <div class="card plain"><span class="k">Teams</span><span class="v">For sessions Claude starts and steers for you.</span></div>
  </div>
  <div class="foot">Either way, git is the record of what happened.</div>
 </div>`,
 notes:"The docs' sizing advice: start with 3 to 5 teammates and 5 to 6 tasks each; three focused teammates often beat five scattered ones.\n\nThe file-sharing warning is the one that bites: teams do not get worktrees. Partition by folder or by layer.\n\nLimits to mention if asked: no /resume of in-process teammates, one team per session, no nested teams.\n\nSources: code.claude.com/docs/en/agent-teams and the costs page for the 7x figure. Verify the experimental flag the week of."
},
{
 act:"Act 6 · Parallel work", n:"25", title:"What we have", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>What we have, side by side</div>
 <div class="body">
  <h2 style="flex:none">Six ways to run more than one agent.</h2>
  <table style="flex:none;font-size:13.5px">
   <tr><th>Approach</th><th>What it is</th><th>Who steers</th><th>A common use</th></tr>
   <tr><td class="mono" style="white-space:nowrap">Subagents</td><td>A helper inside your session, with its own context. It hands back a summary</td><td>Claude</td><td>"Find every Quarkus resource without validation", without the search filling your window</td></tr>
   <tr><td class="mono" style="white-space:nowrap">claude --bg · agents</td><td>Full sessions you start, leave, and check on from one list</td><td>You</td><td>Two changes running in two worktrees while you review a pull request</td></tr>
   <tr><td class="mono" style="white-space:nowrap">Messaging</td><td>Sessions that send each other short notes</td><td>You</td><td>"Change A is committed. Rebase before you ship."</td></tr>
   <tr><td class="mono" style="white-space:nowrap">Agent teams</td><td>A lead session that splits the work and keeps teammates on one task list. Experimental</td><td>A lead agent</td><td>A feature where the workers must keep talking, split by folder</td></tr>
   <tr><td class="mono" style="white-space:nowrap">Workflows</td><td>A script that runs many subagents through fixed steps and checks</td><td>The script</td><td>Build and review every slice of a change, or audit every endpoint</td></tr>
   <tr><td class="mono" style="white-space:nowrap">/batch</td><td>One mechanical change, split into worktrees and pull requests</td><td>Claude</td><td>Rename a field in every module, one pull request each</td></tr>
  </table>
  <div class="foot">Worktrees sit underneath most of these: a checkout each, so nobody edits the same files. Pick with three questions: who steers, do they need to talk, do they touch the same files.</div>
 </div>`,
 notes:"This closes the parallel act: everything they have seen today on one table, each with a use they can picture on the wall. The first columns follow the docs' own comparison, code.claude.com/docs/en/agents.\n\nWalk the three questions with the challenge: two changes you steer yourself, they talk once when one lands, they mostly touch different files. Answer: two background or worktree sessions with messaging. Then the graph half: one change, sliced by a script. Answer: a workflow.\n\nStatus labels to verify the week of: agent view is a research preview, agent teams are experimental and off by default (CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1, about 7 times the tokens when teammates plan, teammates share one checkout).\n\n/batch: a bundled skill. Claude splits one mechanical change into 5 to 30 independent units, you approve the plan, and one background subagent per unit works in its own worktree, runs the tests and opens a pull request.\n\nLeft off the table on purpose: Projects, the cloud threads for work that runs for days, which the docs list as a public beta on Pro and Max."
},
/* ============ ACT 7 ============ */
{
 act:"Act 7 · The price of depth", n:"26", title:"How parallel work uses your plan", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>Your plan, not a bill</div>
 <div class="body">
  <h2 style="flex:none">Parallel work uses up your plan faster.<br>Here is where it goes.</h2>
  <div class="cols c3" style="flex:none">
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:46px">N×</span><span class="v">N sessions at once use about N times the plan. Each one spends on its own.</span></div>
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:46px">~7×</span><span class="v">An agent team whose teammates plan uses about 7 times the tokens of one session.</span></div>
   <div class="card" style="padding:18px 22px"><span class="stat" style="font-size:46px">~15×</span><span class="v">A multi-agent research run used about 15 times the tokens of a chat.</span></div>
  </div>
  <div class="cols c3" style="flex:none">
   <div class="card plain"><span class="k">What drains it fastest</span><span class="v">A long conversation, sent again every turn. A cache miss after more than an hour away. Anything that starts a turn while you are gone: messages from other sessions, goal check-ins, loops.</span></div>
   <div class="card plain"><span class="k">Where to look</span><span class="v"><code>/usage</code>: your 5-hour and weekly bars, the share each skill, subagent, plugin and MCP server took, and any habit over 10%. <code>/workflows</code>: tokens per agent.</span></div>
   <div class="card plain"><span class="k">How to slow it</span><span class="v"><code>/clear</code> between tasks. Sonnet on the workers. One slice before five. <code>crossSessionInbound: hold</code> while you are away.</span></div>
  </div>
  <div class="foot">The 5-hour and weekly windows are shared across models, and on a Team seat with Claude chat too. Switching models doesn't bring a limit back; the reset does.</div>
 </div>`,
 notes:"On a subscription the question is not dollars, it is how fast the bars in /usage move. Talk in multiples.\n\nThe three numbers: each parallel session spends on its own, so N sessions use about N times as much (agent view docs). Agent teams use about 7 times the tokens of a standard session when teammates run in plan mode (costs docs). Anthropic's multi-agent research system used about 15 times the tokens of a chat (their engineering post, June 2025).\n\nWhat drains it, from the costs docs' 'why usage climbs in a long session': the full conversation is sent with every request; the first message after a break longer than the cache lifetime reprocesses everything (an hour on a subscription, five minutes once you draw on usage credits); scheduled loops, messages from other sessions and goal check-ins all start turns while you are idle; every active teammate keeps spending until it exits; compaction is itself a big request, while /clear costs nothing.\n\nWorkflow agents cache for five minutes by default, even on a subscription; subagentPromptCacheTtl: 1h keeps it longer.\n\n/usage on Pro, Max, Team and Enterprise shows attribution by skill, subagent, plugin and MCP server as percentages, flags any behavior that accounts for 10% or more of recent usage, and lists the heaviest loops. Press d or w for the last 24 hours or 7 days. It counts this machine only.\n\nWhen a bar runs out, 'You've hit your session limit' covers every model. Claude Code can wait and continue after the reset, and usage credits exist if your admin turned them on."
},

 notes:"This is where the day lands. Walk the rungs left to right.\n\n1: a prompt to Claude Code opened on a single, narrowly scoped repo, left to run on auto. It is fine for a one-line change. For anything bigger it guesses about the parts it can't see.\n\n2: the same tool, opened on the folder that holds the whole area the change touches (Day 1's start-here rule), starting in its own plan mode, refining the plan, then executing. In our experience this is a large jump in quality over rung 1, and it costs almost nothing extra. It should be everyone's default.\n\n3: their loop, driven by hand. Tier 3 is already a small graph; they are the ones moving it from step to step. 4: the same graph, driving itself, with them at the gates. Each is another jump in how far you can trust the result, and each adds gates to sign and tokens to pay.\n\nThe last sentence on the card is the day's rule: you climb to rung 4 only once rung 3 is boring. Automating a process you are still learning multiplies its mistakes.\n\nThe improvement at every step is real, and so is the price. So choose per piece of work: climb a rung when you can see you need more hands on the wheel, or more stops on the way to your destination.\n\nThere is no benchmark behind the size of these jumps. Say it as experience from eCrop's own work, not as a measured number."

/* ---------- render ---------- */
const stage=document.getElementById('stage');
D.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.dark?' dark':'')+(s.coral?' coral':'');
  el.dataset.i=i;
  el.innerHTML=s.html;
  stage.appendChild(el);
});
const slides=[...document.querySelectorAll('.slide')];
let cur=0;

function fit(){
  const w=window.innerWidth-(document.body.classList.contains('notes-on')?380:0);
  const h=window.innerHeight;
  const k=Math.min((w-48)/1280,(h-72)/720);
  stage.style.transform='scale('+k+')';
}
function show(i){
  cur=Math.max(0,Math.min(D.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  slides.forEach((el,j)=>{if(j!==cur)el.querySelectorAll('video').forEach(v=>v.pause())});
  const s=D[cur];
  document.getElementById('count').textContent=s.n+'  ·  '+(cur+1)+'/'+D.length;
  document.getElementById('actlbl').textContent=s.act.split(' · ')[0];
  document.getElementById('bar').style.width=((cur+1)/D.length*100)+'%';
  document.getElementById('n-title').textContent=s.n+' · '+s.title;
  document.getElementById('n-time').textContent=s.act+'  ·  '+s.time;
  document.getElementById('n-text').textContent=s.notes||'';
  document.getElementById('n-assets').innerHTML=s.gap?'<b>Gap:</b> '+s.gap:'<b>Assets:</b> complete';
  const nx=D[cur+1];
  document.getElementById('n-next').innerHTML=nx?'Next<b>'+nx.n+' · '+nx.title+'</b>':'Next<b>end of deck</b>';
  [...document.querySelectorAll('.ovcell')].forEach((c,j)=>c.classList.toggle('cur',j===cur));
  location.hash=s.n;
}
/* overview */
const og=document.getElementById('ovgrid');
D.forEach((s,i)=>{
  const c=document.createElement('div');
  c.className='ovcell';
  c.innerHTML='<span class="n">'+s.n+'</span><span class="t">'+s.title+'</span>'+
    (s.gap?'<span class="flag">gap</span>':'')+'<span class="a">'+s.act.split(' · ')[0]+'</span>';
  c.onclick=()=>{show(i);toggle('overview',false)};
  og.appendChild(c);
});
function toggle(id,on){
  const el=document.getElementById(id);
  el.classList.toggle('on',on===undefined?!el.classList.contains('on'):on);
}
function notes(){document.body.classList.toggle('notes-on');fit()}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='Escape'){toggle('overview',false);toggle('help',false);return}
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'){e.preventDefault();show(cur+1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();show(cur-1)}
  else if(k==='Home'){show(0)} else if(k==='End'){show(D.length-1)}
  else if(k==='n'||k==='N'){notes()}
  else if(k==='o'||k==='O'){toggle('overview')}
  else if(k==='?'){toggle('help')}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(/^[1-9]$/.test(k)){
    const t=D.findIndex(s=>s.act.startsWith('Act '+k));
    if(t>=0)show(t);
  }
});
document.querySelectorAll('#hud button').forEach(b=>{
  b.onclick=()=>{const g=b.dataset.go;
    if(g==='next')show(cur+1); else if(g==='prev')show(cur-1);
    else if(g==='notes')notes(); else if(g==='overview')toggle('overview'); else toggle('help');
  };
});
window.addEventListener('resize',fit);
const start=D.findIndex(s=>s.n===location.hash.replace('#',''));
fit();show(start>=0?start:0);
</script>
</body>
</html>
