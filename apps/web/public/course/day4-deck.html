<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 4 · Scale it with confidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#cc785c; --primary-active:#a9583e;
  --ink:#141413; --body:#3d3d3a; --body-strong:#252523;
  --muted:#6c6a64; --muted-soft:#8e8b82;
  --hairline:#e6dfd8; --hairline-soft:#ebe6df;
  --canvas:#faf9f5; --surface-soft:#f5f0e8; --surface-card:#efe9de; --cream-strong:#e8e0d2;
  --dark:#181715; --dark-elev:#252320; --dark-soft:#1f1e1b;
  --on-dark:#faf9f5; --on-dark-soft:#a09d96;
  --teal:#5db8a6; --amber:#e8a55a; --success:#5db872; --warning:#d4a017; --error:#c64545;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  overflow:hidden;
}

/* ---------- stage ---------- */
#stage-wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--canvas)}
body.notes-on #stage-wrap{inset:0 380px 0 0}
#stage{
  width:1280px;height:720px;position:relative;
  transform-origin:center center;
  background:var(--canvas);
  box-shadow:0 1px 3px rgba(20,20,19,.08);
  overflow:hidden;
}
.slide{
  position:absolute;inset:0;display:none;
  padding:56px 64px;
  flex-direction:column;
}
.slide.active{display:flex}
.slide.dark{background:var(--dark);color:var(--on-dark)}
.slide.dark .eyebrow{color:var(--on-dark-soft)}
.slide.dark h1,.slide.dark h2{color:var(--on-dark)}
.slide.dark p,.slide.dark li{color:var(--on-dark-soft)}
.slide.coral{background:var(--primary);color:#fff}
.slide.coral h1,.slide.coral h2,.slide.coral p{color:#fff}

/* ---------- type ---------- */
.eyebrow{
  font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:20px;display:flex;gap:12px;align-items:center;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);flex:none}
h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:1.05;letter-spacing:-1.4px;color:var(--ink)}
h2{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.1;letter-spacing:-1px;color:var(--ink)}
h3{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.15;letter-spacing:-.5px;color:var(--ink)}
.lead{font-size:20px;line-height:1.45;color:var(--body-strong);font-weight:400}
p{font-size:17px;color:var(--body)}
.sm{font-size:15px}
.xs{font-size:13.5px;color:var(--muted)}
strong{font-weight:600;color:var(--ink)}
.slide.dark strong{color:var(--on-dark)}
em.q{font-style:italic;font-family:var(--serif);font-size:1.1em;letter-spacing:-.2px}
.coralword{color:var(--primary)}
.slide.dark .coralword{color:var(--amber)}

/* ---------- layout helpers ---------- */
.body{flex:1;display:flex;flex-direction:column;gap:18px;min-height:0;justify-content:center}
.cols{display:grid;gap:26px;flex:1;min-height:0}
.c2{grid-template-columns:1fr 1fr}
.c2w{grid-template-columns:1.15fr .85fr}
.c2n{grid-template-columns:.82fr 1.18fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;justify-content:center}
.center{justify-content:center;align-items:flex-start}
.mid{justify-content:center}

/* ---------- cards ---------- */
.card{background:var(--surface-card);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px}
.card.plain{background:transparent;border:1px solid var(--hairline)}
.card.darkc{background:var(--dark);color:var(--on-dark)}
.card.darkc h3,.card.darkc .k{color:var(--on-dark)}
.card.darkc p,.card.darkc .v{color:var(--on-dark-soft)}
.card.darkc .v strong{color:var(--on-dark)}
.card .k{font-size:16px;font-weight:600;color:var(--ink)}
.card .v{font-size:15px;color:var(--body);line-height:1.5}
.stat{font-family:var(--serif);font-size:56px;line-height:1;letter-spacing:-2px;color:var(--primary);font-weight:500}
.slide.dark .stat{color:var(--amber)}

.hrm{display:grid;grid-template-columns:104px 1fr;gap:10px 18px;align-items:baseline}
.hrm .lbl{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted-soft);padding-top:4px}
.hrm .lbl.move{color:var(--primary)}
.hrm .txt{font-size:17px;color:var(--body);line-height:1.45}
.hrm .txt strong{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13.5px;background:var(--surface-card);color:var(--ink);border-radius:9999px;padding:5px 13px}
.slide.dark .chip{background:var(--dark-elev);color:var(--on-dark)}
.pill{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;border-radius:9999px;padding:4px 11px;background:var(--surface-card);color:var(--ink)}
.pill.coral{background:var(--primary);color:#fff}
.pill.warn{background:#f6e6c8;color:#7a5a08}
.pill.term{background:var(--dark);color:var(--on-dark)}

blockquote{
  border-left:2px solid var(--primary);padding-left:20px;
  font-family:var(--serif);font-size:27px;line-height:1.28;letter-spacing:-.4px;color:var(--ink);font-weight:500;
}
.slide.dark blockquote{color:var(--on-dark)}
blockquote cite{display:block;font-family:var(--sans);font-size:13px;font-style:normal;color:var(--muted);margin-top:12px;letter-spacing:0;font-weight:500}
.slide.dark blockquote cite{color:var(--on-dark-soft)}

/* ---------- assets ---------- */
figure{margin:0;display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
figure img{
  width:100%;height:100%;object-fit:cover;object-position:top left;
  border-radius:12px;border:1px solid var(--hairline);background:var(--dark);
  display:block;min-height:0;
}
figure img.contain{object-fit:contain;object-position:center;background:var(--dark)}
figure img.bottom{object-position:bottom left}
figcaption{font-size:12px;color:var(--muted-soft);font-family:var(--mono);flex:none}
.slide.dark figcaption{color:var(--on-dark-soft)}
.shotgrid{display:grid;gap:12px;flex:1;min-height:0}
figure.vid{flex:none}
figure.vid video{height:380px}
video{width:100%;border-radius:12px;background:#000;object-fit:contain;display:block}

.missing{
  position:absolute;top:18px;right:22px;z-index:5;
  font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;
  background:#f6e6c8;color:#7a5a08;border-radius:9999px;padding:5px 12px;
  display:flex;gap:7px;align-items:center;cursor:default;
}
.slide.dark .missing{background:#4a3c18;color:#f0dcae}
.gapnote{
  background:#faf1dd;border-left:2px solid var(--warning);border-radius:0 8px 8px 0;
  padding:11px 15px;font-size:13.5px;color:#6b5410;line-height:1.45;flex:none;
}
.slide.dark .gapnote{background:#2a2317;color:#d8c38c;border-color:var(--amber)}
.gapnote b{color:#4a3a06}
.slide.dark .gapnote b{color:#f0dcae}

/* ---------- chrome ---------- */
#chrome{position:fixed;left:0;right:0;bottom:0;height:0;z-index:40}
body.notes-on #chrome{right:380px}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--primary);transition:width .22s ease;z-index:41}
#hud{
  position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:14px;
  align-items:center;pointer-events:none;z-index:42;
}
body.notes-on #hud{right:380px}
#hud .grp{
  pointer-events:auto;display:flex;gap:2px;align-items:center;
  background:rgba(250,249,245,.94);border:1px solid var(--hairline);border-radius:9999px;padding:4px;
  backdrop-filter:blur(8px);
}
#hud button{
  border:0;background:transparent;color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;
  padding:6px 12px;border-radius:9999px;cursor:pointer;
}
#hud button:hover{background:var(--surface-card);color:var(--ink)}
#hud .count{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 12px;min-width:86px;text-align:center}
#hud .act{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary);padding:0 10px}

/* ---------- notes ---------- */
#notes{
  position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--dark);color:var(--on-dark);
  padding:26px 24px;overflow-y:auto;display:none;z-index:45;border-left:1px solid #000;
}
body.notes-on #notes{display:block}
#notes h4{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
#notes .nslide{font-family:var(--serif);font-size:24px;letter-spacing:-.4px;color:var(--on-dark);margin-bottom:6px;font-weight:500}
#notes .ntime{font-family:var(--mono);font-size:12px;color:var(--on-dark-soft);margin-bottom:20px}
#notes .ntext{font-size:14.5px;line-height:1.62;color:#d6d2ca;white-space:pre-wrap}
#notes .nassets{margin-top:22px;padding-top:18px;border-top:1px solid #333029;font-size:13px;color:var(--on-dark-soft);line-height:1.6}
#notes .nassets b{color:var(--amber);font-weight:600}
#notes .nnext{margin-top:22px;padding-top:18px;border-top:1px solid #333029;font-size:13px;color:var(--on-dark-soft)}
#notes .nnext b{color:#fff;display:block;margin-top:4px;font-family:var(--serif);font-size:17px;letter-spacing:-.3px}

/* ---------- overview ---------- */
#overview{
  position:fixed;inset:0;background:rgba(250,249,245,.985);z-index:60;display:none;
  overflow-y:auto;padding:40px 44px;
}
#overview.on{display:block}
#overview h3{margin-bottom:22px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.ovcell{
  border:1px solid var(--hairline);border-radius:10px;background:var(--surface-soft);
  padding:12px 13px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:6px;
}
.ovcell:hover{border-color:var(--primary)}
.ovcell.cur{border-color:var(--primary);background:var(--surface-card)}
.ovcell .n{font-family:var(--mono);font-size:11px;color:var(--muted-soft)}
.ovcell .t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.3}
.ovcell .a{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--primary);font-weight:600;margin-top:auto}
.ovcell .flag{font-size:10px;color:#7a5a08;background:#f6e6c8;border-radius:9999px;padding:2px 7px;align-self:flex-start}

/* ---------- help ---------- */
#help{position:fixed;inset:0;background:rgba(20,20,19,.72);z-index:70;display:none;place-items:center}
#help.on{display:grid}
#help .box{background:var(--canvas);border-radius:16px;padding:34px 38px;max-width:460px}
#help h3{margin-bottom:18px}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:14.5px}
#help dt{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface-card);padding:2px 9px;border-radius:5px;justify-self:start}
#help dd{color:var(--body)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted-soft);padding:0 12px 9px 0;border-bottom:1px solid var(--hairline)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--hairline-soft);color:var(--body);vertical-align:top}
td.mono{font-family:var(--mono);font-size:13px;color:var(--ink)}
td.ok{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:0}

ul.clean{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.clean li{font-size:16.5px;color:var(--body);padding-left:18px;position:relative;line-height:1.45}
ul.clean li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--primary)}
ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
ol.steps li{counter-increment:s;font-size:18px;color:var(--body);padding-left:42px;position:relative;line-height:1.4}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;font-family:var(--sans);
}
.vidhead{display:flex;justify-content:space-between;align-items:center;gap:24px;flex:none;margin-bottom:12px}
.vidhead .eyebrow{margin-bottom:0}
.qrinline{display:flex;gap:13px;align-items:center}
.qrinline img{width:96px;height:96px;border-radius:8px;background:var(--canvas);padding:4px;display:block}
.qrinline .lbl{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--on-dark-soft);margin-bottom:4px}
.qrinline .url{display:block;font-family:var(--mono);font-size:14px;color:var(--amber)}
.qr{width:168px;height:168px;border-radius:12px;flex:none;background:var(--canvas);padding:6px}
figure.noimg img,figure.noimg figcaption{display:none}
figure.noimg::before{content:"bizpliz-hero.png";display:grid;place-items:center;flex:1;border:2px dashed var(--hairline);border-radius:12px;font-family:var(--mono);font-size:12px;color:var(--muted-soft)}
.slide.dark .qr{border-color:#3a352d;color:var(--on-dark-soft)}
.logorow{display:flex;gap:26px;align-items:center;margin-top:auto}
.logoplate{
  margin-top:auto;align-self:flex-start;display:flex;align-items:center;gap:30px;
  background:var(--canvas);border-radius:12px;padding:18px 30px;
}
.logoplate img{display:block;width:auto}
.logoplate .lsep{width:1px;align-self:stretch;background:var(--hairline)}
.logoslot{
  height:42px;min-width:108px;border-radius:8px;border:1px dashed #3a352d;
  display:grid;place-items:center;font-size:10.5px;color:var(--on-dark-soft);font-family:var(--mono);padding:0 14px;
}
.slide:not(.dark) .logoslot{border-color:var(--hairline);color:var(--muted-soft)}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hairline);font-size:13px;color:var(--muted);flex:none}
.slide.dark .foot{border-color:#2c2823;color:var(--on-dark-soft)}
.weekmap{display:grid;grid-template-columns:1fr 1fr 1fr 106px 1fr 1fr;gap:11px;align-items:stretch}
.day{background:var(--surface-card);border-radius:12px;padding:19px 17px;display:flex;flex-direction:column;gap:7px}
.day.gap{background:transparent;border:1px dashed var(--hairline)}
.day.dest{background:var(--primary);color:#fff}
.day .dnum{font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.day.dest .dnum{color:rgba(255,255,255,.8)}
.day .dt{font-family:var(--serif);font-size:23px;letter-spacing:-.5px;line-height:1.1;color:var(--ink);font-weight:500}
.day.dest .dt{color:#fff}
.gapweek{border:1px dashed var(--hairline);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 8px;text-align:center}
.gapweek .gw1{font-family:var(--serif);font-size:15px;line-height:1.15;letter-spacing:-.2px;color:var(--muted);font-style:italic}
.gapweek .gw2{font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-soft)}
.loopdiag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loopstep{background:var(--surface-card);border-radius:9999px;padding:10px 20px;font-size:15.5px;font-weight:500;color:var(--ink)}
.loopar{color:var(--primary);font-size:17px}
.gear{border:1px solid var(--hairline);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.gear .gn{font-size:15px;font-weight:600;color:var(--ink)}
.gear .gd{font-size:13.5px;color:var(--muted);line-height:1.45}
.modelrow{display:grid;grid-template-columns:104px 1fr;gap:6px 18px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.modelrow:last-of-type{border-bottom:0}
.modelrow .mn{font-family:var(--serif);font-size:24px;letter-spacing:-.5px;color:var(--ink);font-weight:500}
.modelrow .md{font-size:15px;color:var(--body)}
.modecycle{position:relative;flex:none;height:186px;background:var(--dark);border-radius:12px;overflow:hidden}
.mstate{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:22px 26px;opacity:0;animation:mcyc 8.4s infinite}
.mstate:nth-child(1){animation-delay:0s}
.mstate:nth-child(2){animation-delay:2.8s}
.mstate:nth-child(3){animation-delay:5.6s}
@keyframes mcyc{0%,1%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.mstate .mprompt{font-family:var(--mono);font-size:14px;color:#57534a}
.mstate .mbar{font-family:var(--mono);font-size:16.5px;font-weight:500;display:flex;gap:10px;align-items:center}
.mstate .mwhat{font-size:14px;color:var(--on-dark-soft)}
.mstate .mkey{font-family:var(--mono);font-size:12px;color:#57534a}
.mcap{flex:none;font-size:12px;color:var(--muted-soft);font-family:var(--mono);margin-top:7px}
.hooklist{display:flex;flex-direction:column;gap:7px}
.hookrow{display:flex;gap:12px;align-items:baseline;padding:9px 14px;background:var(--surface-card);border-radius:9px}
.hookrow .hx{color:var(--error);font-weight:700;font-size:14px;flex:none;line-height:1.3}
.hookrow .ht{font-size:14.5px;color:var(--ink);line-height:1.35}
.hookrow.ok{background:var(--surface-soft)}
.hookrow.ok .hx{color:var(--success)}
@media print{body{overflow:visible}.slide{display:flex!important;page-break-after:always}}
</style>
</head>
<body>

<div id="stage-wrap"><div id="stage"></div></div>
<div id="bar"></div>
<div id="hud">
  <div class="grp">
    <button data-go="prev">←</button>
    <span class="count" id="count">00 · 1/29</span>
    <button data-go="next">→</button>
  </div>
  <div class="grp"><span class="act" id="actlbl">Act 1</span></div>
  <div class="grp">
    <button data-go="notes">Notes</button>
    <button data-go="overview">All slides</button>
    <button data-go="help">?</button>
  </div>
</div>

<aside id="notes">
  <h4>Speaker notes</h4>
  <div class="nslide" id="n-title"></div>
  <div class="ntime" id="n-time"></div>
  <div class="ntext" id="n-text"></div>
  <div class="nassets" id="n-assets"></div>
  <div class="nnext" id="n-next"></div>
</aside>

<div id="overview"><h3>Day 1 · all slides</h3><div class="ovgrid" id="ovgrid"></div></div>

<div id="help"><div class="box">
  <h3>Keyboard</h3>
  <dl>
    <dt>→ ↓ Space</dt><dd>Next slide</dd>
    <dt>← ↑</dt><dd>Previous slide</dd>
    <dt>Home / End</dt><dd>First / last slide</dd>
    <dt>N</dt><dd>Speaker notes panel</dd>
    <dt>O</dt><dd>Overview of all slides</dd>
    <dt>F</dt><dd>Fullscreen</dd>
    <dt>1–9</dt><dd>Jump to act</dd>
    <dt>Esc</dt><dd>Close overlay</dd>
  </dl>
</div></div>

<script>
const SHOTS = ""; // assets sit beside this file
const D = [
/* ============ ACT 1 ============ */
{
 act:"Act 1 · Reconnect", n:"00", title:"Holding slide", time:"from −10 min",
 html:`<div class="eyebrow"><span class="dot"></span>While we wait</div>
 <div class="body">
  <div class="cols c2w" style="align-items:center">
   <div class="stack">
    <h1>Day 4. Week two.</h1>
    <p class="lead" style="font-family:var(--serif);font-size:28px;letter-spacing:-.6px;color:var(--primary)">If it were safe, what would you run in parallel?</p>
    <p class="sm">Hold that. By the end of today you will know how to make it safe.</p>
   </div>
   <div class="stack" style="align-items:center">
    <img class="qr" src="qr-carrot.svg" alt="QR code to carrot.ecrop.dev">
    <p class="lead" style="font-family:var(--mono);font-size:19px;color:var(--primary)">carrot.ecrop.dev</p>
   </div>
  </div>
 </div>`,
 notes:"The answers are raw material for the challenge: whatever someone wants to run in parallel is a candidate for the two slices this afternoon. Write them down as people say them."
},

{
 act:"Act 1 · Reconnect", n:"02", title:"Things I found in your forks", time:"10:00",
 html:`<div class="eyebrow"><span class="dot"></span>From the gap week</div>
 <div class="body">
  <h2 style="flex:none">Things I found in your forks.</h2>
  <div class="cols c3" style="flex:none">
   <div class="card"><span class="k">Manuel Cruz</span><span class="xs" style="margin-top:-4px">manuelmcruz · day1-setup · 3 commits</span><ul class="clean" style="gap:8px;margin-top:6px"><li style="font-size:14px">Dark mode on every screen, the TV view included</li><li style="font-size:14px">Caught a flash of the light theme that only shows in a production build, and fixed it</li><li style="font-size:14px">Verified with 109 web tests, 19 end-to-end tests, 60 API tests and a production build</li></ul></div>
   <div class="card"><span class="k">Ricardo Toscanelli</span><span class="xs" style="margin-top:-4px">rtoscanelli · two branches · 3 commits</span><ul class="clean" style="gap:8px;margin-top:6px"><li style="font-size:14px">The same dark mode, built separately through intent and spec, with four known gaps written down</li><li style="font-size:14px">Commands moved to skills, <code>/execute</code> and <code>/intent</code> added, two safety hooks with 15 self-tests</li><li style="font-size:14px">Caught that the hooks were never registered, so they had never run</li></ul></div>
   <div class="card"><span class="k">Filipe Gananca</span><span class="xs" style="margin-top:-4px">filipe-gananca-carrot · day1-setup · 8 commits</span><ul class="clean" style="gap:8px;margin-top:6px"><li style="font-size:14px">A hook that enforces "validation is manual", skipping comments and strings, with 39 tests</li><li style="font-size:14px">The code reviewer made read-only: it had quietly inherited Edit and Write</li><li style="font-size:14px">Playwright running in Docker, and CLAUDE.md rewritten against the real code</li></ul></div>
  </div>
  <div class="card darkc" style="flex:none"><span class="k">The pattern</span><span class="v">The best catches were things that looked fine: a theme that only broke in a production build, hooks that passed their tests but never ran, a reviewer that could edit the code it reviewed. Check that it runs, not only that it exists.</span></div>
 </div>`,
 notes:"Keep it short and credit people by name. Read one detail from each aloud.\n\nManuel (manuelmcruz, day1-setup, 3 commits): a personal CLAUDE.md rewrite with the original kept as .reference, the Day 1 exercise, then dark mode across every surface. Device preference on first visit, the toggle wins after; the value is checked against light and dark before it touches the page; stored in localStorage, not a cookie, so it never rides along on /api requests next to admin_session. /tv gets its own palette through :host-context() because tv.scss redeclares every token. The catch: Angular inlines the light :root block into index.html as critical CSS while the dark block loads later, so a dark-preference browser flashed light first. It only shows in a production build. Fix: optimization.styles.inlineCritical false. Verified: 109 web unit tests, 19 e2e, 60 API tests, production build.\n\nRicardo (rtoscanelli, two branches): slice-09-dark-mode built the same feature separately, through intent 09 and spec 09: a ThemeService on one localStorage key, guarded with try/catch so private browsing falls back to memory, one shared toggle above the router outlet, /tv left out. 106 unit and 12 e2e including a new dark-mode.spec.ts, and four known gaps written down instead of claiming perfection. The second branch moves the commands to skills, adds execute and intents, a TESTING.md rule scoped to test paths, and two PreToolUse hooks (destructive bash, secrets access) with 15 self-tests. The catch: the hooks were described as active but were never registered in settings.json, so Claude Code never ran them. The commit wires them in.\n\nFilipe (filipe-gananca-carrot, day1-setup, 8 commits, no feature, all harness): Compose in dev mode so Docker alone is a Java and Node free environment; a hook that enforces 'validation in apps/api is manual, not Bean Validation', with a scanner that strips comments and strings first so javadoc mentioning @NotBlank does not trip it, 39 test cases and a replay of all 25 Java files; Playwright inside Docker on Microsoft's image with its own node_modules and a shared network namespace; CLAUDE.md rewritten against the real code (it claimed no REST resources, three migrations instead of six, and Bean Validation); the code-reviewer made read-only because it had inherited Edit and Write; the same two safety hooks as Ricardo, arrived at separately; a spec for the sort toggle.\n\nWorth saying: two of you built dark mode without knowing, and two of you wrote the same safety hooks. That is a sign the material landed, and a sign the team would gain from one shared harness.\n\nCheck Filipe's surname spelling before the session."
},

{
 act:"Act 2 · Last week", n:"03", title:"Day 1 · The tool", time:"3:00",
 html:`<div class="eyebrow"><span class="dot"></span>Last week · Day 1 · Monday 21</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Day 1.<br>The tool.</h2>
    <p class="lead">An Anthropic side project that became an agent with hands in your repo. You stop being the clipboard and start steering.</p>
    <div class="card darkc" style="padding:16px 20px"><span class="k">Challenge 1 asked for</span><span class="v">A first CLAUDE.md of your own, and answers about the wall that cite real files.</span></div>
   </div>
   <div class="card" style="align-self:center">
    <ul class="clean" style="gap:12px">
     <li style="font-size:15.5px"><strong>Start in the right folder.</strong> The one that holds every part the task touches. One level too deep and it can't see the API its form calls.</li>
     <li style="font-size:15.5px"><strong>Steer, don't argue.</strong> Esc to stop, <code>/rewind</code> to go back, <code>/resume</code> to pick a session up again.</li>
     <li style="font-size:15.5px"><strong>The window is not storage.</strong> <code>/context</code> to look, <code>/clear</code> between tasks. What must survive goes in files, not in chat.</li>
     <li style="font-size:15.5px"><strong>Give it a way to check its work.</strong> The build, test and lint commands, so "should work" becomes evidence.</li>
     <li style="font-size:15.5px"><strong>The harness is one folder.</strong> <code>.claude/</code>, with six surfaces: rules, skills, agents, workflows, hooks and settings.</li>
    </ul>
   </div>
  </div>
  <div class="foot">Hold on to the first line. The day ends on it.</div>
 </div>`,
 notes:"One slide per day, three minutes each. Ask before you show it: what do you remember from Monday? Then reveal and fill the gaps.\n\nThe first line comes back at the end of today. Starting Claude Code in the folder that holds the whole project, in plan mode, is the first big step up from a one-line prompt on a single repo.\n\nIf someone kept only one habit from Day 1, it should be /clear between tasks."
},
{
 act:"Act 2 · Last week", n:"04", title:"Day 2 · The loop", time:"3:00",
 html:`<div class="eyebrow"><span class="dot"></span>Last week · Day 2 · Tuesday 22</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Day 2.<br>The loop.</h2>
    <p class="lead">Five steps, each leaving a file the next one reads.</p>
    <div class="card darkc" style="padding:16px 20px"><span class="k">Challenge 2 asked for</span><span class="v">Your five commands, each with a contract, and one feature run through them.</span></div>
   </div>
   <div class="card" style="align-self:center">
    <ul class="clean" style="gap:12px">
     <li style="font-size:15.5px"><strong>intent → spec → plan → execute → ship.</strong> Each step writes a file: the intent, the spec, the plan, the evidence, the pull request.</li>
     <li style="font-size:15.5px"><strong>The loop grows with the risk.</strong> Tier 1 prompts directly. Tier 2 plans first. Tier 3 writes a spec, plans on Opus, tests first and ships stacked.</li>
     <li style="font-size:15.5px"><strong>Two dials.</strong> The model is how well it thinks. The effort is how long it thinks.</li>
     <li style="font-size:15.5px"><strong>A command is a step with a contract.</strong> The file pins the model, the effort, the tools and who may run it.</li>
     <li style="font-size:15.5px"><strong>A person signs at the gates.</strong> The plan is where you catch a wrong direction, while it is still a document edit.</li>
    </ul>
   </div>
  </div>
  <div class="foot">Today the loop gets rewired into a graph, and runs in parallel.</div>
 </div>`,
 notes:"Ask: which of your five commands did you actually use during the gap week? The honest answers show where the loop is too heavy for daily work.\n\nThe last line is the idea today builds on most: a graph adds gates, and the gates are where people sign."
},
{
 act:"Act 2 · Last week", n:"05", title:"Day 3 · Superpowers", time:"3:00",
 html:`<div class="eyebrow"><span class="dot"></span>Last week · Day 3 · Wednesday 23</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Day 3.<br>Superpowers.</h2>
    <p class="lead">The loop reached outside the repo.</p>
    <div class="card darkc" style="padding:16px 20px"><span class="k">Challenge 3 asked for</span><span class="v">One step wired to an outside tool, a hook that bounces, and one plugin read before you trust it.</span></div>
   </div>
   <div class="card" style="align-self:center">

     <li style="font-size:15.5px"><strong>Same tool, three doors.</strong> A CLI first, then an MCP server, then a plugin. Every tool definition costs window; Tool Search loads them on demand.</li>
     <li style="font-size:15.5px"><strong>The loop reads the world.</strong> The ticket into <code>/intent</code>, the design into <code>/spec</code>, the browser into <code>/execute</code>, the team from <code>/ship</code>.</li>

    </ul>
   </div>
  </div>

 </div>`,
 notes:"If anyone ran the Opus 5.5 experiment from Guide 3, ask which pin they kept and why.\n\nThe third line matters today: more agents means more things acting at once, and Wednesday's permissions and hooks are what keep them inside the lines."
},
/* ============ ACT 3 ============ */
{
 act:"Act 3 · New commands", n:"06", title:"The advisor", time:"7:00",
 html:`<div class="eyebrow"><span class="dot"></span>New to you · a second opinion, built in</div>
 <div class="body">
  <h2 style="flex:none">Sonnet works. Opus checks the big calls.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">Turn it on</span>
    <div style="font-family:var(--mono);font-size:14px;line-height:1.75;margin-top:2px">/advisor opus<br>claude --advisor opus<br>"advisorModel": "opus"<span style="color:var(--muted-soft)">  · in settings</span><br>/advisor off</div>
    <span class="v" style="font-size:14px;margin-top:6px">Claude decides when to ask: before it commits to an approach, when the same error keeps coming back, and before it says it is done. You can also just say "consult the advisor before you continue".</span>
   </div>
   <div class="card"><span class="k">Four ways to bring in a stronger model</span>
    <table style="font-size:14px;margin-top:4px">
     <tr><th>Approach</th><th>When the stronger model runs</th></tr>
     <tr><td class="mono">/advisor</td><td>At decision points, when Claude asks</td></tr>
     <tr><td class="mono">opusplan</td><td>In plan mode, then Sonnet builds</td></tr>
     <tr><td class="mono">subagent · model</td><td>For the whole subtask</td></tr>
     <tr><td class="mono">/model</td><td>From the next request on</td></tr>
    </table>
   </div>
  </div>
  <div class="cols c2" style="flex:none">
   <div class="card plain"><span class="k">What it costs</span><span class="v">Each call reads the whole conversation again at the advisor's price, with no cache. It only runs at decision points, so it usually costs less than the strong model on every turn. It shows in <code>/usage</code>.</span></div>
   <div class="card plain"><span class="k">Know first</span><span class="v">Experimental. Works with a Claude subscription or an API key, but not through Bedrock, Google Cloud or Foundry. The advisor must be at least as strong as the main model, and Haiku can't advise.</span></div>
  </div>
  <div class="foot">Why it matters today: many Sonnet workers, one Opus on call.</div>
 </div>`,
 notes:"The smallest change on this list with the biggest effect on a parallel day. Sonnet does the routine turns. At the moments that decide the outcome, Claude sends the whole conversation, every tool call and result, to the advisor and gets advice back. The advisor only advises: Claude applies it, and if the files contradict the advice, Claude says so instead of following it blindly.\n\nThey met opusplan on Day 1: Opus plans, Sonnet builds. The table is the docs' own comparison, and the difference is timing. opusplan uses the strong model at the start; the advisor uses it whenever a decision comes up, including at the end, before 'done'.\n\nDemo: in a Sonnet session run /advisor opus, give it a task with a real decision in it, and wait for the 'Advising' line in the transcript. Ctrl+O shows what the advisor said.\n\nPairings from the docs: Sonnet main with an Opus advisor is the common one. An Opus 5.5 main accepts only Fable or Opus 5 and later as advisor; Opus with Opus is the high-stakes independent check.\n\nCost: on API billing you pay the advisor's rates; on a subscription it counts toward plan limits. Turning it on or off mid-session does not break the main prompt cache.\n\nIt works on a Team subscription as well as an API key: the docs say it is available to both subscription and API-billed accounts. It is not available through Bedrock, Google Cloud or Foundry. Subagents inherit it. It is switched on by a feature flag, so if DISABLE_TELEMETRY is set it stays off. CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1 turns it off entirely, for admins who want that.\n\nSource: code.claude.com/docs/en/advisor. Verify the experimental label the week of."
},
{
 act:"Act 3 · New commands", n:"07", title:"/goal", time:"6:00",
 html:`<div class="eyebrow"><span class="dot"></span>New to you · a finish line</div>
 <div class="body">
  <div class="cols c2n">
   <div class="stack" style="justify-content:center">
    <h2>Keep going<br>until it's true.</h2>
    <p class="lead">You set a finish line. After every turn a small, fast model reads the conversation and answers: not yet, done, or impossible. Not yet means Claude starts the next turn on its own.</p>
    <div class="card darkc" style="padding:14px 18px"><span class="v" style="font-family:var(--mono);font-size:14px;color:#fff">/goal the tests in apps/api pass and no test file was changed. Stop after 15 turns.</span></div>
    <ul class="clean">
     <li><code>/goal</code> on its own shows the turns, the tokens and the judge's last reason</li>
     <li><code>/goal clear</code> stops it early</li>
    </ul>
   </div>
   <div class="stack" style="gap:12px">
    <div class="card"><span class="k">Write it so the transcript proves it</span><span class="v">The judge doesn't run anything or open files. It only reads what Claude showed. "npm test exits 0" works. "The code is clean" doesn't.</span></div>
    <div class="card"><span class="k">It doesn't change permissions</span><span class="v">In manual mode it still stops to ask. Auto mode removes the approval before each tool. <code>/goal</code> removes the wait for you between turns.</span></div>
    <div class="card plain"><span class="k">You have seen this before</span><span class="v">It is Day 2's Stop hook, typed as one line and kept for one session. Put it in settings when you want it every time.</span></div>
   </div>
  </div>
  <div class="foot">A loop with a finish line and a judge. Keep that picture for the graphs this afternoon.</div>
 </div>`,
 notes:"The second small tool, and the bridge to this afternoon. /goal is the shortest loop you can write: a condition, a worker, and a judge that is not the worker. The docs make the point directly: completion is decided by a fresh model, not the one doing the work.\n\nDemo: in the wall, a /goal with a real test target and a turn cap. Show the verdict line after each turn, and Ctrl+O for the reason behind it.\n\nA good condition has one measurable end state, a stated check, and the things that must not change on the way. Up to 4,000 characters. The turn cap goes inside the condition; there is no separate flag.\n\nIt clears on its own when the judge says done or impossible, and on errors you have to fix: sign-in, no credit left, a context overflow that compaction couldn't clear, a model that isn't available. The judge runs on Haiku by default and costs little next to the main turns.\n\nIt also runs headless: claude -p \"/goal ...\" runs to the end in one call. That is tomorrow's factory in one line.\n\nNext to /loop: /loop repeats on a timer, /goal works toward a condition.\n\nSource: code.claude.com/docs/en/goal."
},
{
 act:"Act 3 · New commands", n:"08", title:"Fix the one before you run five", time:"8:00",
 html:`<div class="eyebrow"><span class="dot"></span>New to you · the rest of the drawer</div>
 <div class="body">
  <h2 style="flex:none">Fix the one before you run five.</h2>
  <div class="cols c2" style="flex:none">
   <div class="card"><span class="k">Inside one session</span>
    <ul class="clean" style="gap:9px;margin-top:4px">
     <li style="font-size:14.5px"><code>/btw</code>: a side question. It answers from what the session already knows, uses no tools and stays out of the history. Works while Claude is busy</li>
     <li style="font-size:14.5px"><code>/branch</code>: try another direction and keep the original in <code>/resume</code>. <code>/fork</code> sends the copy to a background session instead</li>
     <li style="font-size:14.5px"><code>/diff</code>: every uncommitted change, Claude's and yours, without leaving the session</li>
     <li style="font-size:14.5px"><code>/code-review</code>: a background review of your branch for bugs. <code>--fix</code> applies what it finds. <code>/simplify</code> only tidies</li>
    </ul>
   </div>
   <div class="card"><span class="k">Your setup, before every worktree copies it</span>
    <ul class="clean" style="gap:9px;margin-top:4px">
     <li style="font-size:14.5px"><code>/doctor</code>: finds skills, MCP servers and plugins you don't use and what they cost in context, flags slow hooks, trims a long CLAUDE.md. Asks before it changes anything</li>
     <li style="font-size:14.5px"><code>/fewer-permission-prompts</code>: reads your past sessions and adds the read-only commands you keep approving to <code>.claude/settings.json</code></li>
     <li style="font-size:14.5px"><code>/statusline</code>: describe the bar in words and Claude writes it. Worktree, context and cost, in every session</li>
     <li style="font-size:14.5px"><code>/insights</code>: a report on how you have been working, where it went wrong, and what to try</li>
    </ul>
   </div>
  </div>
  <div class="card darkc" style="flex:none"><span class="k">Do it now, on the wall</span><span class="v">Run <code>/doctor</code> and read what it found before you say yes. Then <code>/statusline show the worktree, context used and session cost</code>.</span></div>
  <div class="foot">Every parallel session inherits your setup, waste included. <code>/rename</code> and <code>/color</code> tell the windows apart.</div>
 </div>`,
 notes:"Ten minutes, mostly live. Pick two from each column rather than all eight.\n\nLeft column, one session. /btw is the one people end up using every day: ask 'what was that config file again?' while Claude is mid-task, and nothing lands in the conversation. It has no tools; for a question that needs them, press f to fork it into a background subagent. /branch switches you into the copy; /fork leaves a copy working in the background and tells it to make its own worktree before it edits. /code-review runs as a background subagent, so its --fix edits sit outside your checkpoints and /rewind won't undo them. Use git.\n\nRight column, the setup. The point of the title: five worktrees means five copies of every unused MCP server, every slow hook and every permission prompt. Run /doctor on the wall now; it reports first and asks before it touches anything. /fewer-permission-prompts writes to the project settings file, which gets committed, so read the diff first. /statusline can show workspace.git_worktree, context_window.used_percentage and cost.total_cost_usd, and on Pro and Max the five-hour limit. /insights writes ~/.claude/usage-data/report.html from up to 200 new sessions on this machine; its tokens count against your plan, and it isn't available in cloud sessions.\n\n/rename and /color: name each worktree session and give it a prompt-bar colour, so five terminals are not five identical windows. /rename also makes cross-session messages easier to address later.\n\nAlready covered last week and still true: /context, /rewind, /effort, /usage.\n\nSources: code.claude.com/docs/en commands, interactive-mode, code-review, statusline and costs pages."
},
/* ============ ACT 4 ============ */
{
 act:"Act 4 · Scale it with confidence", n:"09", title:"Day 4. Scale it with confidence.", time:"4:00", dark:true,
 html:`<div class="eyebrow"><span class="dot"></span>Day 4 · 28 September</div>
 <div class="body mid">
  <h1 style="font-size:54px">Day 4. Scale it with confidence.</h1>
  <p class="lead" style="color:var(--amber);font-size:22px;margin-top:4px;max-width:1010px">Every day this week we found the next bottleneck and moved it into a file. Today the bottleneck is you, typing the next command.</p>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px">
   <div style="background:var(--dark-elev);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45;color:var(--on-dark-soft);"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber);margin-bottom:6px">Day 1</span>Memory kept in chat<br><strong style="color:#fff;font-weight:600">→ CLAUDE.md and files</strong></div>
   <div style="background:var(--dark-elev);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45;color:var(--on-dark-soft);"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber);margin-bottom:6px">Day 2</span>Retyping the same prompts<br><strong style="color:#fff;font-weight:600">→ Commands with contracts</strong></div>
   <div style="background:var(--dark-elev);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45;color:var(--on-dark-soft);"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber);margin-bottom:6px">Day 3</span>Copying from tickets and browsers<br><strong style="color:#fff;font-weight:600">→ CLIs, MCP, rules and hooks</strong></div>
   <div style="background:var(--primary);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45;color:#fff"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:#fff;margin-bottom:6px">Day 4 · today</span>You, typing the next command<br><strong style="color:#fff;font-weight:600">→ The graph drives, you approve</strong></div>
   <div style="background:var(--dark-elev);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45;color:var(--on-dark-soft);background:transparent;border:1px dashed #4a4640"><span style="display:block;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber);margin-bottom:6px">Day 5</span>You, having to be there<br><strong style="color:#fff;font-weight:600">→ Triggers and the factory</strong></div>
  </div>
  <p class="sm" style="color:var(--on-dark-soft);margin-top:18px;max-width:1010px">With confidence means: let a graph drive, and scale it, only when you trust the process. Not while you are still learning it.</p>
 </div>`,
 notes:"The theme of the day: the tool is as configurable and as deep as you want to take it, and every layer is optional.\n\nThe row is the week's pattern. Each day we did something by hand, felt where it hurt, and moved that into a file: memory into CLAUDE.md, repeated prompts into commands, copy and paste from outside into CLIs, MCP, rules and hooks. Today the thing that hurts is you, typing /intent, then /spec, then /plan, then /execute, then /ship. So today the graph drives and you approve. Tomorrow the bottleneck is that you have to be there at all.\n\nSay the last line slowly, because it is what 'with confidence' means: automation and scale multiply whatever your process already does. If the process is still being learned, they multiply the mistakes. Automate and scale only what you already trust.\n\nThe day ends on a ladder of four ways to use Claude Code, from a single prompt to a graph that drives itself. Their job is to pick the rung for each piece of work."
},

 act:"Act 5 · Graphs", n:"10", title:"Same map, different driver", time:"8:00",
